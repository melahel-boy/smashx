<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmashX</title>
<meta name="theme-color" content="#031021"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-column phone app. Header, one working view at a time, fixed bottom tabs.
   Scoreboard in two team colors on a court-green ground; shuttle-yellow marks game point. */
:root{
  --bg:#EBF1EE; --surface:#FFFFFF; --surface2:#E1EAE5; --ink:#11231C; --muted:#586C63; --line:#C9D7D0;
  --accent:#0D7556; --accent-ink:#FFFFFF; --bad:#B8362A; --hi:#F2CF3D; --hi-ink:#2B2400;
  --ta:#2859D1; --ta-soft:#DDE6FA; --tb:#C9691A; --tb-soft:#F9E5D0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1714; --surface:#15231E; --surface2:#1E3029; --ink:#E8F1EC; --muted:#93A9A0; --line:#2A4036;
    --accent:#35C79A; --accent-ink:#06241B; --bad:#FF8577; --hi:#F2CF3D; --hi-ink:#2B2400;
    --ta:#8AA7FF; --ta-soft:#1B2A52; --tb:#F2A65E; --tb-soft:#46300F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1714; --surface:#15231E; --surface2:#1E3029; --ink:#E8F1EC; --muted:#93A9A0; --line:#2A4036;
  --accent:#35C79A; --accent-ink:#06241B; --bad:#FF8577; --hi:#F2CF3D; --hi-ink:#2B2400;
  --ta:#8AA7FF; --ta-soft:#1B2A52; --tb:#F2A65E; --tb-soft:#46300F; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font:500 16px/1.35 var(--body);
  padding-block:0 calc(66px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.hero{width:100%;height:auto;display:block;border-radius:12px;margin:0 0 10px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 0}
.brand{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;flex:none}
.brand svg{width:24px;height:24px;color:var(--accent);flex:none}
.sync{font-size:12px;color:var(--muted);text-align:right;min-width:0}
h2{font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:10px 0 8px;text-wrap:balance}
h3{font:700 14px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;min-height:44px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:3px}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
textarea{padding:10px 12px;min-height:90px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:700;line-height:1.5;white-space:nowrap}
.chip.srv{background:var(--accent);color:var(--accent-ink)}
.chip.hi{background:var(--hi);color:var(--hi-ink)}
.chip.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.chip.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.chip.W{background:var(--accent);color:var(--accent-ink)}
.chip.L{background:var(--surface2);color:var(--muted)}
.err-msg{color:var(--bad);font-weight:600;font-size:14px}
/* Inline rows: an input or select with its action button beside it */
.inl{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.inl input[type],.inl select{flex:1 1 0;min-width:0;width:auto}
.inl .btn{flex:none}
/* Compact player row */
.prw{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pinfo{flex:1 1 150px;min-width:0}
.pact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--bad);border-radius:10px;width:38px;height:38px;padding:0;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn:active{transform:scale(.94)}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot-card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}.slot-card b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}.slot-card select{min-height:38px}.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:18px}.modal-card{width:min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 16px 50px #0005}.empty{text-align:center;padding:16px 12px}
.empty b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}

/* Match list */
.mcard{display:grid;gap:4px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.mcard .tn{font-weight:600;display:flex;justify-content:space-between;gap:8px;min-width:0}
.mcard .tn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .tn.win{font-weight:800}
.mcard .sc{font:700 20px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.live{border-color:var(--accent);box-shadow:inset 6px 0 0 var(--accent)}

/* Scoring */
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:14px;padding:6px 10px 8px;min-width:0}
.side.a,.team.a{--tc:var(--ta)}
.side.b,.team.b{--tc:var(--tb)}
.side .lbl{font-size:13px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font:800 96px/.95 var(--display);color:var(--tc);font-variant-numeric:tabular-nums}
.side .st{min-height:24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:6px 2px}
.team{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:14px;padding:4px 12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0}
.prow+.prow{border-top:1px solid var(--line)}
.pname{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:12.5px;color:var(--muted)}
.pbtn{min-width:92px;min-height:54px;border-radius:12px;font-weight:800;font-size:15px;border:2px solid transparent;background:transparent}
.pbtn.win{background:var(--accent);color:var(--accent-ink)}
.pbtn.err{color:var(--bad);border-color:var(--bad)}
.pbtn:active{transform:scale(.96)}
.shots{display:flex;gap:6px;flex-wrap:wrap}
.sc-btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;min-height:38px;font-weight:700;font-size:14px}
.sc-btn.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:0}
.log li{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .s{font:700 17px/1.2 var(--display);letter-spacing:.04em;min-width:58px;font-variant-numeric:tabular-nums}
.log .ta{color:var(--ta)} .log .tb{color:var(--tb)}

/* Stats */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px}
.pcard .mg{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pcard .mg div{padding:6px}
.nw{white-space:nowrap}
.mg div{background:var(--surface2);border-radius:10px;padding:6px 8px;min-width:0}
.mg b{display:block;font:700 28px/1.05 var(--display);font-variant-numeric:tabular-nums}
.mg span{font-size:12px;color:var(--muted);font-weight:600}
.pcard{display:grid;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.pcard .nm{font-weight:800;font-size:18px;display:flex;justify-content:space-between;gap:8px}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.brow{display:grid;grid-template-columns:78px 1fr 34px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 5px;text-align:right;border-top:1px solid var(--line);font-size:14px}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:700}
.tbl th{font-size:12px;color:var(--muted);border-top:0}
.scroll-x{overflow-x:auto}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 12px}
summary{font-weight:700;cursor:pointer;min-height:26px}

/* Bottom tabs */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:4px max(12px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav div{max-width:560px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:1px;padding:4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);min-height:46px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent);background:var(--surface2)}
@media (prefers-reduced-motion:reduce){.btn:active,.pbtn:active,.iconbtn:active{transform:none}}
@media (max-width:380px){.num{font-size:80px}.pbtn{min-width:80px}}
</style></head><body>
<div class="wrap">
  <header class="hd">
    <div class="brand">
      <img src="logo-mark.png" alt="" width="34" height="34" style="border-radius:8px;flex:none">
      SmashX
    </div>
    <div class="sync" id="sync"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Main"><div>
  <button data-act="tab" data-v="matches" id="t-matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M3 12h18"/></svg>Sessions</button>
   <button data-act="tab" data-v="mygames" id="t-mygames"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>My Games</button>
  <button data-act="tab" data-v="players" id="t-players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 14.5c2.7 0 5 2 5 5.5"/></svg>Players</button>
  <button data-act="tab" data-v="stats" id="t-stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20V14"/></svg>Stats</button>
</div></nav>

<script>
(function(){
'use strict';
/*CORE*/
var SHOTS=[['s','Smash'],['d','Drop'],['n','Net'],['v','Drive'],['l','Lob'],['x','Serve']];
var SHOT={};SHOTS.forEach(function(x){SHOT[x[0]]=x[1];});
var CAP={21:30,15:21,11:15};
function uid(){return Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6);}
function sessionUid(){try{var a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}catch(e){return uid()+uid()+uid()+uid();}}
function isOver(a,b,tg){var mx=Math.max(a,b);return (mx>=tg&&Math.abs(a-b)>=2)||mx>=(CAP[tg]||tg+9);}
function parseR(s){var a=String(s).split(':');return{t:+a[0],p:a[1],k:a[2],s:a[3]||''};}
/* pos = [A right, A left, B right, B left]. Index 0 of a team is the right court. */
/* Singles games have pos = [A, B]; the server's court follows their own score (even = right). */
function gameState(g,tg){
  g=g||{};var pos=Array.isArray(g.pos)?g.pos.slice():[];var rallies=Array.isArray(g.r)?g.r:[];
  if(pos.length!==2&&pos.length!==4)pos=['','','',''];
  if(pos.length===2)pos=[pos[0],pos[1]];
  var sg=pos.length===2;
  var P=sg?[[pos[0]],[pos[1]]]:[[pos[0],pos[1]],[pos[2],pos[3]]];
  var s=[0,0],srv=g.f===1?1:0,over=false,winner=-1,n=0;
  for(var i=0;i<rallies.length;i++){
    if(over)break;
    var r=parseR(g.r[i]);
    s[r.t]++;n++;
    if(r.t===srv){if(!sg)P[r.t]=[P[r.t][1],P[r.t][0]];}else{srv=r.t;}
    if(isOver(s[0],s[1],tg)){over=true;winner=s[0]>s[1]?0:1;}
  }
  var server=sg?P[srv][0]:P[srv][s[srv]%2===0?0:1];
  return{s:s,srv:srv,server:server,P:P,over:over,winner:winner,n:n,sg:sg};
}
/* Players on one side. Old matches have no type and four players, so they stay doubles. */
function teamIds(m,T){var ids=m&&Array.isArray(m.tm)?m.tm:[];if(!ids.length)return[];var per=Math.ceil(ids.length/2);return ids.slice(T*per,Math.min((T+1)*per,ids.length));}
/* Permanent display ID, derived from the player's permanent record id so old players need no migration. */
function pidFor(id){
  id=String(id);
  var h1=2166136261,h2=5381,i,c;
  for(i=0;i<id.length;i++){c=id.charCodeAt(i);h1^=c;h1=Math.imul(h1,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0;}

  for(i=0;i<6;i++){s=A.charAt(n%32)+s;n=Math.floor(n/32);}
  return 'SX-'+s;

function displayId(p){return p.pid||pidFor(p.id);}
function matchesQ(p,q){
  q=String(q||'').trim().toLowerCase();
  if(!q)return true;
  return String(p.name||'').toLowerCase().indexOf(q)>=0||displayId(p).toLowerCase().indexOf(q)>=0;
}
function wouldWin(st,t,tg){var s=st.s.slice();s[t]++;return isOver(s[0],s[1],tg);}
function matchState(m){m=m||{};m.g=Array.isArray(m.g)?m.g:[];m.tm=Array.isArray(m.tm)?m.tm:[];m.bo=Number(m.bo)||1;m.tg=Number(m.tg)||21;
  var need=Math.ceil(m.bo/2),w=[0,0],games=[];
  m.g.forEach(function(g){var st=gameState(g,m.tg);games.push(st);if(st.over)w[st.winner]++;});
  var winner=w[0]>=need?0:(w[1]>=need?1:-1);
  var cur=games[games.length-1]||gameState({pos:m.tm.length===2?m.tm.slice():m.tm.slice(0,4),f:0,r:[]},m.tg);
  return{games:games,w:w,need:need,winner:winner,done:winner>=0,cur:cur,closed:!!m.st,st:m.st||''};
}
function inc(o,k){o[k]=(o[k]||0)+1;}
function computeStats(matches){
  var P={},pairs={};
  function get(id){return P[id]||(P[id]={id:id,m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,f:0,tp:0,tl:0,sw:{},se:{},sf:{},form:[],partners:{}});}
  /* Cancelled matches are kept in history but never counted in anyone's stats. */
  var list=matches.filter(function(m){return !m.del&&m.st!=='cancelled';}).sort(function(a,b){return a.t-b.t;});
  list.forEach(function(m){
    var ms=matchState(m),ids=m.tm;
    ids.forEach(get);
    function team(id){return ids.indexOf(id)<ids.length/2?0:1;}
    m.g.forEach(function(g,gi){
      g.r.forEach(function(raw){
        var r=parseR(raw);
        ids.forEach(function(id){if(team(id)===r.t)get(id).tp++;else get(id).tl++;});
        /* w = winner, e = error (a player's mistake), f = fault (a rule violation) */
        if(r.k==='w'){get(r.p).w++;inc(get(r.p).sw,r.s||'-');}
        else if(r.k==='f'){get(r.p).f++;inc(get(r.p).sf,r.s||'-');}
        else{get(r.p).e++;inc(get(r.p).se,r.s||'-');}
      });
      var st=ms.games[gi];
      if(st.over)ids.forEach(function(id){if(team(id)===st.winner)get(id).gw++;else get(id).gl++;});
    });
    if(ms.done){
      ids.forEach(function(id){
        var p=get(id),won=team(id)===ms.winner;

        p.form.push(won?'W':'L');
        if(ids.length===4){
          var T=team(id),partner=ids[T*2]===id?ids[T*2+1]:ids[T*2];
          var pr=p.partners[partner]||(p.partners[partner]={w:0,l:0});
          if(won)pr.w++;else pr.l++;

      });
      if(ids.length===4)[0,1].forEach(function(T){
        var pr=[ids[T*2],ids[T*2+1]].sort(),key=pr.join('+');

function okMatch(m){
  if(!m||!m.id)return false;
  if(m.del)return true;
  return Array.isArray(m.tm)&&(m.tm.length===4||m.tm.length===2)&&Array.isArray(m.g)&&m.g.length>0&&typeof m.tg==='number'&&typeof m.bo==='number'&&
    m.g.every(function(g){return g&&Array.isArray(g.pos)&&g.pos.length===m.tm.length&&Array.isArray(g.r)&&(g.f===0||g.f===1);});

function clone(x){return JSON.parse(JSON.stringify(x));}
/* Merge records by id, newest `u` wins. Returns true when anything changed. */
function mergeInto(S,dirty,rp,rm,markDirty){
  var ch=false,i;
  var lp={};S.players.forEach(function(p){lp[p.id]=p;});
  (rp||[]).forEach(function(r){
    if(!r||!r.id||typeof r.name!=='string')return;
    var l=lp[r.id];
    if(!l){S.players.push(clone(r));ch=true;if(markDirty)dirty.p=true;}
    else if((r.u||0)>(l.u||0)){Object.assign(l,clone(r));ch=true;if(markDirty)dirty.p=true;}
  });
  var lm={};S.matches.forEach(function(m){lm[m.id]=m;});
  (rm||[]).forEach(function(r){
    if(!okMatch(r))return;

function roundRobin(d){
  var ids=sessionRoster(d).filter(function(x,i,a){
    return x&&a.indexOf(x)===i;
  });
  var mode=d.matchType||'d';
  var per=mode==='s'?2:4;
  var min=Math.max(1,parseInt(d.minGamesPerPlayer,10)||1);
  var equal=d.scheduleMode==='equal';
  if(ids.length<per){
    ui.err='Add at least '+per+' joined players to generate games.';
    render();return;
  }

  var old=Array.isArray(d.rounds)?d.rounds:[];
  var kept=[],counts={};
  ids.forEach(function(pid){counts[pid]=0;});

  old.forEach(function(rr){
    var locked=[];
    (rr.fixtures||[]).forEach(function(fx){
      if(fx.matchId||fx.startedAt){
        locked.push(fx);
        (fx.teams||[]).forEach(function(team){
          (team||[]).forEach(function(pid){
            if(counts[pid]!==undefined)counts[pid]++;
          });
        });
      }
    });
    if(locked.length){
      kept.push({
        id:rr.id,
        name:rr.name,
        fixtures:locked,
        bye:rr.bye||[],
        createdAt:rr.createdAt||Date.now()
      });
    }
  });

  var target=Math.max(min,Math.max.apply(null,ids.map(function(pid){
    return counts[pid]||0;
  })));

  if(equal){
    while(true){
      var needed=ids.length*target-ids.reduce(function(sum,pid){
        return sum+(counts[pid]||0);
      },0);
      if(needed>=0&&needed%per===0)break;
      target++;
      if(target>1000){
        ui.err='Could not create an equal schedule with the completed games.';
        render();return;
      }
    }
  }

  var remaining=ids.length*target-ids.reduce(function(sum,pid){
    return sum+(counts[pid]||0);
  },0);

  if(remaining<0||remaining%per!==0){
    ui.err='Existing games prevent an equal schedule. Completed games were kept unchanged.';
    render();return;
  }

  var gameCount=remaining/per;
  var fresh=[];
  for(var g=0;g<gameCount;g++){
    var pool=ids.slice().sort(function(a,b){
      var diff=(counts[a]||0)-(counts[b]||0);
      return diff||Math.random()-.5;
    }).slice(0,per);

    if(pool.length!==per)break;

    for(var p=pool.length-1;p>0;p--){
      var q=Math.floor(Math.random()*(p+1));
      var tmp=pool[p];pool[p]=pool[q];pool[q]=tmp;
    }

    var half=per/2;
    var fx={
      id:uid(),
      teams:[pool.slice(0,half),pool.slice(half)],
      names:['Team A','Team B']
    };
    pool.forEach(function(pid){counts[pid]++;});

    fresh.push({
      id:uid(),
      name:'Round '+(kept.length+fresh.length+1),
      fixtures:[fx],
      bye:ids.filter(function(pid){return pool.indexOf(pid)<0;}),
      createdAt:Date.now()
    });
  }

  d.rounds=kept.concat(fresh);
  saveSessionDoc(d);
  ui.err='Schedule updated. '+fresh.length+' new games created.';
  render();
}

function sumStats(list){
  var o={m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,f:0,tp:0,tl:0,sw:{},se:{},sf:{},form:[],partners:{}};
  list.forEach(function(p){
    ['m','mw','ml','gw','gl','w','e','f','tp','tl'].forEach(function(k){o[k]+=(p[k]||0);});
    ['sw','se','sf'].forEach(function(k){Object.keys(p[k]||{}).forEach(function(x){o[k][x]=(o[k][x]||0)+p[k][x];});});
    Object.keys(p.partners).forEach(function(id){var q=o.partners[id]||(o.partners[id]={w:0,l:0});q.w+=p.partners[id].w;q.l+=p.partners[id].l;});
    o.form=o.form.concat(p.form);
  });
  return o;
}

function fixBtn(){return '<div style="margin-top:8px"><button class="btn sm" data-act="hardreload">Refresh app</button></div>';}
function hardReload(){
  var go=function(){location.reload();};
  try{
    var jobs=[];
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));
    if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}));
    Promise.all(jobs).then(go,go);
  }catch(e){go();}
}

    metric(p.w,'Winners')+metric(p.e,'Errors')+metric(signed(p.w-p.e),'Net')+metric(pct(p.w,p.tp),'Share of team points')+'</div></div>';
  var maxW=Math.max.apply(null,Object.keys(p.sw).map(function(k){return p.sw[k];}).concat([1]));

  if(hasShots){

  }
  var maxE=Math.max.apply(null,Object.keys(p.se).map(function(k){return p.se[k];}).concat([1]));
  if(keys.some(function(k){return p.se[k];})){
    h+='<h3>Errors by shot</h3><div class="card stack">'+keys.filter(function(k){return p.se[k];}).map(function(k){var n=p.se[k];return '<div class="brow"><span>'+(k==='-'?'Untagged':SHOT[k])+'</span><div class="bar"><span style="width:'+Math.round(n*100/maxE)+'%;background:var(--bad)"></span></div><b>'+n+'</b></div>';}).join('')+'</div>';
  }
  var pk=Object.keys(p.partners);
  if(pk.length){
    h+='<h3>With partners</h3><div class="card"><ul class="log">'+pk.map(function(id){var x=p.partners[id];return '<li><span class="s">'+x.w+'–'+x.l+'</span><span>with '+esc(nameOf(id))+'</span></li>';}).join('')+'</ul></div>';
  }
  if(p.form.length){

  }
  return h+'</div>';
}

async function joinSession(raw,role){
  try{
    var sid=String(raw||'').trim();
    var mt=sid.match(/[?&]join=([^&]+)/);
    if(mt)sid=decodeURIComponent(mt[1]);
    sid=sid.replace(/^.*\//,'');
    if(!sid){
      ui.err='Enter a Session ID or invite link.';
      render();return;
    }

    var d=await cloud.api.get('sessions',sid);
    if(!d){
      ui.err='Session not found. Check the ID or link.';
      render();return;
    }

    var chosen=role||'player';
    var members=d.members||{};
    var requests=d.roleRequests||{};
    var ids=Array.isArray(d.memberUids)?d.memberUids.slice():[];

    if(chosen==='refereeRequest'){
      requests[meId()]='referee';
      members[meId()]='player';
    }else{
      members[meId()]=chosen;
    }

    if(ids.indexOf(meId())<0)ids.push(meId());

    d.memberUids=ids;
    d.members=members;
    d.roleRequests=requests;

    var myPlayer=S.players.find(function(p){
      return p&&p.uid===meId();
    });

    if(chosen==='player'){
      if(!myPlayer){
        var joinPid=uid();
        myPlayer={
          id:joinPid,
          pid:pidFor(joinPid),
          name:(cloud.user&&cloud.user.name)||'Player',
          uid:meId(),
          by:meId(),
          u:Date.now()
        };
        await cloud.api.set('players',myPlayer.id,clean(myPlayer));
        S.players.push(myPlayer);
      }

      d.roster=sessionRoster(d);
      d.slots=Array.isArray(d.slots)?d.slots:[];

      var alreadySlot=d.slots.some(function(sl){
        return sl&&sl.playerId===myPlayer.id;
      });

      if(!alreadySlot){
        var empty=d.slots.find(function(sl){
          return sl&&!sl.playerId;
        });

        if(d.slots.length&&!empty){
          ui.err='All player slots are full. Ask the Session Admin to increase the player count.';
          render();return;
        }

        if(empty){
          var emptyNo=empty.number;
          empty.playerId=myPlayer.id;
          empty.joinedAt=Date.now();

          (d.rounds||[]).forEach(function(rr){
            (rr.fixtures||[]).forEach(function(ff){
              if(!Array.isArray(ff.teams))return;
              [0,1].forEach(function(tt){
                ff.teams[tt]=(ff.teams[tt]||[]).map(function(x){
                  return x==='slot:'+emptyNo?myPlayer.id:x;
                });
              });
            });
          });
        }else if(!d.slots.length){
          d.slots.push({
            number:1,
            playerId:myPlayer.id,
            joinedAt:Date.now()
          });
          d.totalPlayers=1;
        }

        if(d.roster.indexOf(myPlayer.id)<0){
          d.roster.push(myPlayer.id);
        }
      }
    }

    d.u=Date.now();
    await cloud.api.set('sessions',sid,clean(d));

    var local=sessionDoc(sid);
    if(local)Object.assign(local,d);
    else S.sessions.push(d);

    ui.sid=sid;
    ui.view='session';
    ui.joinId='';
    ui.joinPrompt=false;
    ui.err='';
    startWatch();
    render();

  }catch(e){
    console.error(e);
    ui.err='Could not join. Check the Session ID and Firebase Rules.';
    render();
  }
}

    case 'editround':{var ed=sessionDoc(id),er=(ed&&ed.rounds||[]).find(function(x){return x.id===b.dataset.rid;});if(er&&canManageSession(id)){var nn=window.prompt('Round name',er.name||'');if(nn===null)break;er.name=nn.trim()||er.name;(er.fixtures||[]).forEach(function(fx,ix){var an=window.prompt('Match '+(ix+1)+' Team A name',fx.names&&fx.names[0]||'Team A');if(an===null)return;var bn=window.prompt('Match '+(ix+1)+' Team B name',fx.names&&fx.names[1]||'Team B');if(bn===null)return;fx.names=[an.trim()||'Team A',bn.trim()||'Team B'];var av=window.prompt('Team A players (enter registered player names separated by commas)',(fx.teams[0]||[]).map(nameOf).join(', '));if(av!==null){var aa=av.split(',').map(function(x){return x.trim().toLowerCase();}).filter(Boolean).map(function(x){var pp=players().find(function(q){return q.name.toLowerCase()===x;});return pp&&pp.id;}).filter(Boolean);if(aa.length)fx.teams[0]=aa;}var bv=window.prompt('Team B players (enter registered player names separated by commas)',(fx.teams[1]||[]).map(nameOf).join(', '));if(bv!==null){var bb=bv.split(',').map(function(x){return x.trim().toLowerCase();}).filter(Boolean).map(function(x){var pp=players().find(function(q){return q.name.toLowerCase()===x;});return pp&&pp.id;}).filter(Boolean);if(bb.length)fx.teams[1]=bb;}});saveSessionDoc(ed);render();}break;}
    case 'opensession':ui.sid=id;ui.view='session';render();window.scrollTo(0,0);break;
    case 'copylink':GenCopy(sessionLink(id),'Invite link');break;
    case 'copyid':GenCopy(id,'Private Session ID');break;
    case 'joinpublic':joinSession(id,'player');break;
    case 'setref':{var sd2=sessionDoc(id),sel=document.getElementById('refereeuid');if(sd2&&canManageSession(id)){var target=sel?sel.value:'';sd2.refereeUid=target||null;if(target)sd2.members[target]='referee';Object.keys(sd2.members||{}).forEach(function(k){if(k!==target&&sd2.members[k]==='referee')sd2.members[k]='player';});sd2.u=Date.now();cloud.api.set('sessions',id,sd2).catch(writeErr);render();}break;}
    case 'approveref':{var sd3=sessionDoc(id),who=b.dataset.uid;if(sd3&&canManageSession(id)&&sd3.roleRequests&&sd3.roleRequests[who]){Object.keys(sd3.members||{}).forEach(function(k){if(sd3.members[k]==='referee')sd3.members[k]='player';});sd3.refereeUid=who;sd3.members[who]='referee';delete sd3.roleRequests[who];sd3.u=Date.now();cloud.api.set('sessions',id,sd3).catch(writeErr);render();}break;}
    case 'setsk':{var sm=S.matches.find(function(x){return x.id===id;}),sk=document.getElementById('scorekeeperuid');if(sm&&canManageSession(sm.sid)&&Array.isArray(sm.g)&&sm.g.length&&Array.isArray(sm.g[sm.g.length-1].r)&&sm.g[sm.g.length-1].r.length===0&&sk){sm.g[sm.g.length-1].sk=sk.value||null;touchM(sm);render();}break;}
    case 'addgame':{var sgp=sessionGroups().find(function(x){return x.sid===id;});if(sgp){ui.sid=id;ui.form={venue:sgp.venue,sessionDate:sgp.date,sessionTime:sgp.time,ty:'d',sessionType:'d'};ui.err='';ui.view='new';render();window.scrollTo(0,0);}break;}
    case 'addsinglesgame':{var ssg=sessionGroups().find(function(x){return x.sid===id;});if(ssg){ui.sid=id;ui.form={venue:ssg.venue,sessionDate:ssg.date,sessionTime:ssg.time,ty:'s',sessionType:'d'};ui.err='';ui.view='new';render();window.scrollTo(0,0);}break;}
    case 'delsession':{var ds=sessionDoc(id);if(ds&&canManageSession(id)){if(!window.confirm('Delete this Session and all its Games? This cannot be undone.'))break;(async function(){try{var gm=S.matches.filter(function(x){return x&&x.sid===id;});for(var di=0;di<gm.length;di++){await cloud.api.del('matches',gm[di].id);}await cloud.api.del('sessions',id);S.matches=S.matches.filter(function(x){return !x||x.sid!==id;});S.sessions=S.sessions.filter(function(x){return x.id!==id;});ui.sid=null;ui.mid=null;ui.view='list';ui.err='Session and its Games deleted.';render();window.scrollTo(0,0);}catch(de){ui.err='Could not delete Session. Check Firebase Rules and try again.';render();}})();}break;}
    case 'open':{ui.mid=id;var m=curMatch();ui.sid=m&&m.sid?m.sid:null;ui.view=m&&(matchState(m).done||matchState(m).closed||(!canScore(m)&&!canManageSession(m.sid)))?'detail':'match';ui.shot='';ui.next=null;render();window.scrollTo(0,0);break;}
    case 'detail':ui.mid=id;ui.view='detail';render();window.scrollTo(0,0);break;
    case 'resume':{var rm=S.matches.find(function(x){return x.id===id;});if(rm&&(canScore(rm)||canManageSession(rm.sid))){ui.mid=id;ui.view='match';ui.next=null;render();window.scrollTo(0,0);}break;}
    case 'pt':addRally(b.dataset.p,'w');break;
    case 'er':addRally(b.dataset.p,'e');break;
    case 'mtype':readForm();ui.form.ty=b.dataset.t;ui.err='';render();break;
    case 'cxopen':ui.cx={id:id,kind:'ended',reason:''};render();break;
    case 'cxkind':if(ui.cx){var ri=document.getElementById('cxr');if(ri)ui.cx.reason=ri.value;ui.cx.kind=b.dataset.k;render();}break;
    case 'cxno':ui.cx=null;render();break;
    case 'cxgo':{
      var cm=S.matches.find(function(x){return x.id===id&&!x.del;}),ri2=document.getElementById('cxr');
      if(cm&&canManageSession(cm.sid)&&!cm.st&&ui.cx){cm.st=ui.cx.kind;cm.cx={r:(ri2?ri2.value:'').trim().slice(0,140),at:Date.now(),by:meId()};touchM(cm);}
      ui.cx=null;ui.mid=id;ui.view='detail';render();window.scrollTo(0,0);break;
    }
    case 'shot':ui.shot=ui.shot===b.dataset.s?'':b.dataset.s;render();break;
    case 'undo':undo();break;
    case 'nserve':if(ui.next){ui.next.f=+b.dataset.t;render();}break;
    case 'nswap':if(ui.next){var T=+b.dataset.t,p=ui.next.pos,t=p[T*2];p[T*2]=p[T*2+1];p[T*2+1]=t;render();}break;
    case 'startnext':{var m2=curMatch();if(m2&&ui.next&&canManageSession(m2.sid)){m2.g.push({f:ui.next.f,pos:ui.next.pos.slice(),r:[],sk:null});ui.next=null;ui.shot='';touchM(m2);render();window.scrollTo(0,0);}break;}
    case 'delmatch':{
  var delTarget=S.matches.find(function(x){return x.id===id;});
  if(!delTarget||!canManageSession(delTarget.sid))break;
  if(ui.confirm!=='del:'+id){
    ui.confirm='del:'+id;
    render();
    break;
  }
  (async function(){
    try{
      var sid=delTarget.sid;
      await deleteSessionMatch(id);
      ui.confirm=null;
      ui.mid=null;
      if(sid){
        ui.sid=sid;
        ui.view='session';
        ui.err='Match deleted. You can start this game again.';
        render();
      }else{
        go('matches','list');
      }
    }catch(e){
      ui.err='Could not delete Match. Check connection and Firebase Rules.';
      render();
    }
  })();
  break;
    }
    case 'ren':ui.edit=id;render();setTimeout(function(){var i=document.getElementById('rn');if(i){i.focus();i.select();}},0);break;
    case 'cancel-edit':ui.edit=null;render();break;
    case 'rmp':{
      if(ui.confirm!=='rm:'+id){ui.confirm='rm:'+id;render();break;}
      var rp=S.players.find(function(x){return x.id===id;});
      if(rp){rp.del=1;touchP(rp);}
      ui.confirm=null;render();break;
    }
    case 'player':ui.pid=id;ui.view='player';render();window.scrollTo(0,0);break;
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  if(f.dataset.form==='findplayer'){var pi=document.getElementById('playeridsearch');findPlayerByUniqueId(pi?pi.value:ui.playerSearchId);return;}
  if(f.dataset.form==='join'){e.preventDefault();var ji=document.getElementById('joinid'),jr=document.getElementById('joinrole');ui.joinId=ji?ji.value:'';ui.joinRole=jr?jr.value:'player';joinSession(ui.joinId,ui.joinRole);return;}else if(f.dataset.form==='addp'){
    if(ui.tab==='matches')readForm();
    var inp=document.getElementById('np');
    addPlayer(inp?inp.value:'');
    render();
    var i2=document.getElementById('np');if(i2&&ui.err)i2.focus();
  }else if(f.dataset.form==='ren'){
    var nm=(document.getElementById('rn').value||'').trim(),p=S.players.find(function(x){return x.id===f.dataset.id;});
    if(!nm){ui.err='Name cannot be empty.';render();return;}
    if(p){p.name=nm;touchP(p);}
    ui.edit=null;ui.err='';render();
  }
});
document.addEventListener('change',function(e){if(e.target.closest('#view')&&ui.tab==='matches'&&ui.view==='new'){readForm();if(e.target.id==='f-sessiontype')ui.form.ty=e.target.value;if(e.target.id==='f-totalPlayers'){ui.form.totalPlayers=e.target.value;}if(['f-tg','f-bo','f-a1','f-a2','f-b1','f-b2','f-sessiontype','f-totalPlayers','f-creatorRole'].indexOf(e.target.id)>=0)render();}});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){
    window.__wl=null;if(ui.tab==='matches'&&ui.view==='match')keepAwake();
  }
});

render();
try{var qp=new URLSearchParams(location.search).get('join');if(qp){ui.joinId=qp;ui.err='Choose your role to join this session.';ui.joinPrompt=true;render();}}catch(e){}
if('serviceWorker' in navigator&&!window.__FAKE_CLOUD__)navigator.serviceWorker.register('sw.js').catch(function(){});
setTimeout(function(){if(ui.auth==='loading'){ui.slow=true;render();}},8000);
bootCloud().catch(function(){ui.auth='out';ui.err='Could not reach Google. Check your internet and refresh.';render();});
})();
