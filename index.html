<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmashX</title>
<meta name="theme-color" content="#031021">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1714; --surface:#15231E; --surface2:#1E3029; --ink:#E8F1EC; --muted:#93A9A0; --line:#2A4036;
  --accent:#35C79A; --accent-ink:#06241B; --bad:#FF8577; --hi:#F2CF3D; --hi-ink:#2B2400;
  --ta:#8AA7FF; --ta-soft:#1B2A52; --tb:#F2A65E; --tb-soft:#46300F;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font:500 16px/1.4 var(--body);
  padding-block:0 92px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.hero{width:100%;height:auto;display:block;border-radius:12px;margin:0 0 14px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px}
.brand{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;flex:none}
.sync{font-size:12px;color:var(--muted);text-align:right;min-width:0}
h2{font:700 24px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:18px 0 10px}
h3{font:700 14px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:48px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
select,input[type=text],textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
textarea{padding:10px 12px;min-height:90px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:700;line-height:1.5;white-space:nowrap}
.chip.srv{background:var(--accent);color:var(--accent-ink)}
.chip.hi{background:var(--hi);color:var(--hi-ink)}
.err-msg{color:var(--bad);font-weight:600;font-size:14px}
.empty{text-align:center;padding:26px 16px}
.empty b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}

/* Match list */
.mcard{display:grid;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mcard .tn{font-weight:600;display:flex;justify-content:space-between;gap:8px;min-width:0}
.mcard .tn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .tn.win{font-weight:800}
.mcard .sc{font:700 20px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.live{border-color:var(--accent);box-shadow:inset 6px 0 0 var(--accent)}

/* Scoring */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:14px;padding:8px 12px 10px;min-width:0}
.side.a,.team.a{--tc:var(--ta)}
.side.b,.team.b{--tc:var(--tb)}
.side .lbl{font-size:13px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font:800 96px/.95 var(--display);color:var(--tc);font-variant-numeric:tabular-nums}
.side .st{min-height:24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:10px 2px}
.team{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:14px;padding:4px 12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0}
.prow+.prow{border-top:1px solid var(--line)}
.pname{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:12.5px;color:var(--muted)}
.pbtn{min-width:76px;min-height:54px;border-radius:12px;font-weight:800;font-size:15px;border:2px solid transparent;background:transparent}
.pbtn.win{background:var(--accent);color:var(--accent-ink)}
.pbtn.err{color:var(--bad);border-color:var(--bad)}
.pbtn:active{transform:scale(.96)}
.shots{display:flex;gap:6px;flex-wrap:wrap}
.sc-btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;min-height:38px;font-weight:700;font-size:14px}
.sc-btn.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:0}
.log li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .s{font:700 17px/1.2 var(--display);letter-spacing:.04em;min-width:58px;font-variant-numeric:tabular-nums}
.log .ta{color:var(--ta)} .log .tb{color:var(--tb)}

/* Stats */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.pcard .mg{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pcard .mg div{padding:8px}
.nw{white-space:nowrap}
.mg div{background:var(--surface2);border-radius:10px;padding:8px 10px;min-width:0}
.mg b{display:block;font:700 28px/1.05 var(--display);font-variant-numeric:tabular-nums}
.mg span{font-size:12px;color:var(--muted);font-weight:600}
.pcard{display:grid;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pcard .nm{font-weight:800;font-size:18px;display:flex;justify-content:space-between;gap:8px}

/* Bottom tabs */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav div{max-width:560px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent);background:var(--surface2)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <div class="brand">
      <img src="logo-mark.png" alt="SmashX" width="34" height="34" style="border-radius:8px;flex:none;object-fit:cover" onerror="this.style.display='none'">
      SmashX
    </div>
    <div class="sync" id="sync">Offline mode</div>
  </header>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="Main" id="main-nav"><div>
  <button data-act="tab" data-v="matches" id="t-matches" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M3 12h18"/></svg>Matches</button>
  <button data-act="tab" data-v="history" id="t-history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>History</button>
  <button data-act="tab" data-v="sessions" id="t-sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Sessions</button>
  <button data-act="tab" data-v="players" id="t-players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 14.5c2.7 0 5 2 5 5.5"/></svg>Players</button>
  <button data-act="tab" data-v="stats" id="t-stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20V14"/></svg>Stats</button>
</div></nav>

<script>
(function(){
'use strict';

var SHOTS=[['s','Smash'],['d','Drop'],['n','Net'],['v','Drive'],['l','Lob'],['x','Serve']];
var SHOT={};SHOTS.forEach(function(x){SHOT[x[0]]=x[1];});
var CAP={21:30,15:21,11:15};

function uid(){return Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6);}
function isOver(a,b,tg){var mx=Math.max(a,b);return (mx>=tg&&Math.abs(a-b)>=2)||mx>=(CAP[tg]||tg+9);}
function parseR(s){var a=String(s).split(':');return{t:+a[0],p:a[1],k:a[2],s:a[3]||''};}

// Data persistence
function loadLocal(key, def){try{var v=localStorage.getItem('smashx_'+key);return v?JSON.parse(v):def;}catch(e){return def;}}
function saveLocal(key, val){try{localStorage.setItem('smashx_'+key,JSON.stringify(val));}catch(e){}}

var S={
  players: loadLocal('players', [{id:'p1',name:'Dani'},{id:'p2',name:'Naveen'},{id:'p3',name:'Nikhil'},{id:'p4',name:'Kiran'}]),
  matches: loadLocal('matches', []),
  sessions: loadLocal('sessions', [])
};

var ui={tab:'matches',view:'list',mid:null,shot:'',next:null,err:'',form:{},sessionMode:'list'};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function players(){return S.players.filter(function(p){return !p.del;});}
function liveMatches(){return S.matches.filter(function(m){return !m.del;});}
function nameOf(id){var p=S.players.find(function(x){return x.id===id;});return p?p.name:'Player';}
function curMatch(){return S.matches.find(function(m){return m.id===ui.mid&&!m.del;});}
function matchSize(m){return (+m.sz===1||(m.tm&&m.tm.length===2))?1:2;}
function teamIds(m,T){return matchSize(m)===1?[m.tm[T]]:[m.tm[T*2],m.tm[T*2+1]];}
function teamName(m,T){return teamIds(m,T).map(nameOf).join(' & ');}
function fmtDate(t){try{return new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});}catch(e){return '';}}
function pct(a,b){return b?Math.round(a*100/b)+'%':'–';}
function signed(n){return (n>0?'+':'')+n;}
function courtOf(st,T,id){if(st.P[T].length===1)return 'Singles Court';return st.P[T].indexOf(id)===0?'Right court':'Left court';}

function gameState(g,tg,isSingles){
  var one=!!isSingles;
  var P=one?[[g.pos[0]],[g.pos[1]]]:[[g.pos[0],g.pos[1]],[g.pos[2],g.pos[3]]];
  var s=[0,0],srv=g.f,over=false,winner=-1,n=0;
  for(var i=0;i<g.r.length;i++){
    if(over)break;
    var r=parseR(g.r[i]);
    s[r.t]++;n++;
    if(!one&&r.t===srv){P[r.t]=[P[r.t][1],P[r.t][0]];}else if(r.t!==srv){srv=r.t;}
    if(isOver(s[0],s[1],tg)){over=true;winner=s[0]>s[1]?0:1;}
  }
  var server=one?P[srv][0]:P[srv][s[srv]%2===0?0:1];
  return{s:s,srv:srv,server:server,P:P,over:over,winner:winner,n:n};
}

function wouldWin(st,t,tg){var s=st.s.slice();s[t]++;return isOver(s[0],s[1],tg);}
function matchState(m){
  var need=Math.ceil(m.bo/2),w=[0,0],games=[];
  var isSingles=matchSize(m)===1;
  (m.g||[]).forEach(function(g){var st=gameState(g,m.tg,isSingles);games.push(st);if(st.over)w[st.winner]++;});
  var winner=w[0]>=need?0:(w[1]>=need?1:-1);
  var cur=games[games.length-1];
  return{games:games,w:w,need:need,winner:winner,done:winner>=0,cur:cur};
}

function computeStats(matches){
  var P={},pairs={};
  function get(id){return P[id]||(P[id]={id:id,m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,tp:0,tl:0});}
  matches.forEach(function(m){
    var ms=matchState(m),ids=m.tm||[],isSingles=matchSize(m)===1;
    ids.forEach(get);
    function team(id){return isSingles?(ids.indexOf(id)):(ids.indexOf(id)<2?0:1);}
    (m.g||[]).forEach(function(g,gi){
      (g.r||[]).forEach(function(raw){
        var r=parseR(raw);
        ids.forEach(function(id){if(team(id)===r.t)get(id).tp++;else get(id).tl++;});
        if(r.k==='w')get(r.p).w++; else get(r.p).e++;
      });
      var st=ms.games[gi];
      if(st&&st.over)ids.forEach(function(id){if(team(id)===st.winner)get(id).gw++;else get(id).gl++;});
    });
    if(ms.done){
      ids.forEach(function(id){
        var won=team(id)===ms.winner;
        P[id].m++; if(won)P[id].mw++; else P[id].ml++;
      });
    }
  });
  return P;
}

function matchCard(m){
  var ms=matchState(m),done=ms.done;
  var line=ms.games.filter(function(g){return g.n>0;}).map(function(g){return g.s[0]+'–'+g.s[1];}).join(' · ');
  return '<button class="mcard'+(done?'':' live')+'" data-act="open" data-id="'+m.id+'">'+
    '<div class="row sp small muted"><span>'+esc(fmtDate(m.t))+' · to '+m.tg+'</span><span>'+(done?'<span class="chip">Finished</span>':'<span class="chip srv">In progress</span>')+'</span></div>'+
    [0,1].map(function(T){return '<div class="tn'+(ms.winner===T?' win':'')+'"><span>'+esc(teamName(m,T))+'</span><span>'+(ms.winner===T?'Won ':'')+ms.w[T]+'</span></div>';}).join('')+
    '<div class="sc">'+(line||'0–0')+'</div></button>';
}

function viewList(){
  var ms=liveMatches().sort(function(a,b){return b.t-a.t;});
  var prog=ms.filter(function(m){return !matchState(m).done;});
  var h='<div class="row sp"><h2>Live Matches</h2><button class="btn primary sm" data-act="new">New match</button></div><div class="stack">';
  if(!prog.length){
    h+='<div class="card empty"><b>No active matches</b><p class="muted">Tap "New match" or create a Session to start.</p></div>';
  } else {
    h+=prog.map(matchCard).join('');
  }
  return h+'</div>';
}

function viewHistory(){
  var ms=liveMatches().sort(function(a,b){return b.t-a.t;});
  var done=ms.filter(function(m){return matchState(m).done;});
  var h='<h2>Match History</h2><div class="stack">';
  if(!done.length){
    h+='<div class="card empty"><b>No completed matches</b><p class="muted">Finished matches will show up here automatically.</p></div>';
  } else {
    h+=done.map(matchCard).join('');
  }
  return h+'</div>';
}

function selOpts(sel){return '<option value="">Choose…</option>'+players().map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+'</option>';}).join('');}

function viewNew(){
  var pl=players(),f=ui.form;
  var h='<div class="row sp"><button class="btn sm" data-act="back">← Cancel</button></div><h2>New match</h2>';
  if(!f.sz)f.sz='2';
  if(!f.tg){f.tg='21';f.bo='3';f.sv='0';}
  var single=f.sz==='1';
  h+='<div class="stack"><div class="card stack"><div class="field"><label>Format</label><select id="f-sz"><option value="2"'+(!single?' selected':'')+'>Doubles</option><option value="1"'+(single?' selected':'')+'>Singles</option></select></div></div>';
  h+='<div class="card stack"><b style="color:var(--ta)">Team A</b><div class="grid2"><div class="field"><label>Player 1</label><select id="f-a1">'+selOpts(f.a1)+'</select></div>'+(single?'':'<div class="field"><label>Player 2</label><select id="f-a2">'+selOpts(f.a2)+'</select></div>')+'</div></div>';
  h+='<div class="card stack"><b style="color:var(--tb)">Team B</b><div class="grid2"><div class="field"><label>Player 1</label><select id="f-b1">'+selOpts(f.b1)+'</select></div>'+(single?'':'<div class="field"><label>Player 2</label><select id="f-b2">'+selOpts(f.b2)+'</select></div>')+'</div></div>';
  h+='<button class="btn primary block" data-act="start">Start match</button></div>';
  return h;
}

function teamCard(m,ms,T,gs,over){
  var g=ms.cur,cls=T===0?'a':'b';
  var ids=teamIds(m,T);
  var rows=ids.map(function(id){
    var x=gs[id]||{w:0,e:0},isSrv=!over&&g.srv===T&&g.server===id;
    return '<div class="prow"><div style="min-width:0"><div class="row" style="gap:6px"><span class="pname">'+esc(nameOf(id))+'</span>'+(isSrv?'<span class="chip srv">Serving</span>':'')+'</div>'+
      '<div class="pmeta">'+courtOf(g,T,id)+' · '+x.w+' won</div></div>'+
      '<button class="pbtn win" data-act="pt" data-p="'+id+'"'+(over?' disabled':'')+'>Point</button>'+
      '<button class="pbtn err" data-act="er" data-p="'+id+'"'+(over?' disabled':'')+'>Error</button></div>';
  }).join('');
  return '<div class="team '+cls+'">'+rows+'</div>';
}

function viewScore(){
  var m=curMatch();
  if(!m){ui.view='list';return viewList();}
  var ms=matchState(m),g=ms.cur,tg=m.tg,gi=m.g.length,over=g.over;
  var gs={}; (g.r||[]).forEach(function(raw){var r=parseR(raw);var x=gs[r.p]||(gs[r.p]={w:0,e:0});if(r.k==='w')x.w++;else x.e++;});
  var h='<div class="row sp"><button class="btn sm" data-act="back">← Matches</button><span class="small muted">Game '+gi+' of '+m.bo+'</span></div>';
  h+='<div class="board" style="margin-top:12px">'+[0,1].map(function(T){
    return '<div class="side '+(T===0?'a':'b')+'"><div class="lbl">'+(T===0?'A':'B')+' · '+esc(teamName(m,T))+'</div><div class="num">'+g.s[T]+'</div></div>';
  }).join('')+'</div>';
  h+='<div class="stack" style="margin-top:12px">'+teamCard(m,ms,0,gs,over)+teamCard(m,ms,1,gs,over)+'</div>';
  if(over&&!ms.done){
    h+='<div class="card stack" style="margin-top:12px"><button class="btn primary block" data-act="startnext">Start Game '+(gi+1)+'</button></div>';
  }
  h+='<div class="row" style="margin-top:12px"><button class="btn" data-act="undo">↶ Undo Point</button></div>';
  return h;
}

function viewSessions(){
  if(ui.sessionMode==='create'){
    var playerBoxes=players().map(function(p){
      return '<label class="row"><input type="checkbox" class="sess-p" value="'+p.id+'" checked> <span>'+esc(p.name)+'</span></label>';
    }).join('');
    return '<div class="row sp"><h2>New Session</h2><button class="btn sm" data-act="cancelsession">Cancel</button></div>'+
      '<div class="card stack"><div class="field"><label>Title</label><input type="text" id="s-title" placeholder="Evening Session"></div>'+
      '<div class="field"><label>Format</label><select id="s-type"><option value="doubles">Doubles</option><option value="singles">Singles</option></select></div>'+
      '<div class="field"><label>Players</label><div class="card stack">'+playerBoxes+'</div></div>'+
