<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmashX Pro</title>
<meta name="theme-color" content="#031021">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBF1EE; --surface:#FFFFFF; --surface2:#E1EAE5; --ink:#11231C; --muted:#586C63; --line:#C9D7D0;
  --accent:#0D7556; --accent-ink:#FFFFFF; --bad:#B8362A; --hi:#F2CF3D; --hi-ink:#2B2400;
  --ta:#2859D1; --ta-soft:#DDE6FA; --tb:#C9691A; --tb-soft:#F9E5D0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font:500 16px/1.4 var(--body);
  padding-block:0 92px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px}
.brand{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.sync{font-size:12px;color:var(--muted);text-align:right}
h2{font:700 24px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:18px 0 10px}
h3{font:700 14px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:48px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
select,input[type=text]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:700}
.chip.srv{background:var(--accent);color:var(--accent-ink)}
.chip.hi{background:var(--hi);color:var(--hi-ink)}
.err-msg{color:var(--bad);font-weight:600;font-size:14px}
.empty{text-align:center;padding:26px 16px}
.empty b{display:block;font:700 22px/1.1 var(--display);margin-bottom:6px}

.mcard{display:grid;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mcard .tn{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.mcard .tn.win{font-weight:800}
.mcard .sc{font:700 20px/1 var(--display)}
.live{border-color:var(--accent);box-shadow:inset 6px 0 0 var(--accent)}

.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:14px;padding:8px 12px 10px}
.side.a,.team.a{--tc:var(--ta)}
.side.b,.team.b{--tc:var(--tb)}
.side .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.num{font:800 96px/.95 var(--display);color:var(--tc)}
.team{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:14px;padding:4px 12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0}
.prow+.prow{border-top:1px solid var(--line)}
.pname{font-weight:800;font-size:18px}
.pmeta{font-size:12.5px;color:var(--muted)}
.pbtn{min-width:76px;min-height:54px;border-radius:12px;font-weight:800;font-size:15px;background:transparent;border:2px solid transparent}
.pbtn.win{background:var(--accent);color:var(--accent-ink)}
.pbtn.err{color:var(--bad);border-color:var(--bad)}
.shots{display:flex;gap:6px;flex-wrap:wrap}
.sc-btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;min-height:38px;font-weight:700}
.sc-btn.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.log .s{font:700 17px/1.2 var(--display);min-width:58px}
.log .ta{color:var(--ta)} .log .tb{color:var(--tb)}

.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.mg div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.mg b{display:block;font:700 28px/1.05 var(--display)}
.mg span{font-size:12px;color:var(--muted);font-weight:600}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);font-size:14px}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:700}
.tbl th{font-size:12px;color:var(--muted);border-top:0}
.scroll-x{overflow-x:auto}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
summary{font-weight:700;cursor:pointer}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding:6px 16px}
.nav div{max-width:560px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);min-height:52px}
.nav button.on{color:var(--accent);background:var(--surface2)}
</style></head><body>
<div class="wrap">
  <header class="hd">
    <div class="brand">SmashX Pro</div>
    <div class="sync" id="sync">Ready</div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav"><div>
  <button data-act="tab" data-v="matches" id="t-matches">Matches</button>
  <button data-act="tab" data-v="me" id="t-me">Me</button>
  <button data-act="tab" data-v="players" id="t-players">Players</button>
  <button data-act="tab" data-v="stats" id="t-stats">Stats</button>
</div></nav>

<script>
(function(){
'use strict';
var SHOTS=[['s','Smash'],['d','Drop'],['n','Net'],['v','Drive'],['l','Lob'],['x','Serve'],['b','Break']];
var SHOT={};SHOTS.forEach(function(x){SHOT[x[0]]=x[1];});
var CAP={21:30,15:21,11:15};
function uid(){return Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6);}
function isOver(a,b,tg){var mx=Math.max(a,b);return (mx>=tg&&Math.abs(a-b)>=2)||mx>=(CAP[tg]||tg+9);}
function parseR(s){var a=String(s).split(':');return{t:+a[0],p:a[1],k:a[2],s:a[3]||''};}

function gameState(g,tg,isSingles){
  var P = isSingles ? [[g.pos[0]], [g.pos[1]]] : [[g.pos[0],g.pos[1]],[g.pos[2],g.pos[3]]];
  var s=[0,0],srv=g.f,over=false,winner=-1,n=0;
  for(var i=0;i<g.r.length;i++){
    if(over)break;
    var r=parseR(g.r[i]);
    if(r.k==='b') continue;
    s[r.t]++;n++;
    if(!isSingles){if(r.t===srv){P[r.t]=[P[r.t][1],P[r.t][0]];}else{srv=r.t;}} else {srv=r.t;}
    if(isOver(s[0],s[1],tg)){over=true;winner=s[0]>s[1]?0:1;}
  }
  var server = isSingles ? P[srv][0] : P[srv][s[srv]%2===0?0:1];
  return{s:s,srv:srv,server:server,P:P,over:over,winner:winner,n:n};
}
function wouldWin(st,t,tg){var s=st.s.slice();s[t]++;return isOver(s[0],s[1],tg);}
function matchState(m){
  var isSingles = m.mode === 'singles';
  var need=Math.ceil(m.bo/2),w=[0,0],games=[];
  m.g.forEach(function(g){var st=gameState(g,m.tg,isSingles);games.push(st);if(st.over)w[st.winner]++;});
  var winner=w[0]>=need?0:(w[1]>=need?1:-1);
  return{games:games,w:w,need:need,winner:winner,done:winner>=0,cur:games[games.length-1]};
}
function inc(o,k){o[k]=(o[k]||0)+1;}
function computeStats(matches){
  var P={},pairs={};
  function get(id){return P[id]||(P[id]={id:id,m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,tp:0,tl:0,sw:{},se:{},form:[],partners:{}});}
  matches.filter(function(m){return !m.del;}).forEach(function(m){
    var ms=matchState(m),ids=m.tm,isSingles=m.mode==='singles';
    ids.forEach(get);
    function team(id){return isSingles ? (ids[0]===id?0:1) : (ids.indexOf(id)<2?0:1);}
    m.g.forEach(function(g,gi){
      g.r.forEach(function(raw){
        var r=parseR(raw);
        if(r.k==='b')return;
        ids.forEach(function(id){if(team(id)===r.t)get(id).tp++;else get(id).tl++;});
        if(r.k==='w'){get(r.p).w++;inc(get(r.p).sw,r.s||'-');}
        else if(r.k==='e'){get(r.p).e++;inc(get(r.p).se,r.s||'-');}
      });
      var st=ms.games[gi];
      if(st.over)ids.forEach(function(id){if(team(id)===st.winner)get(id).gw++;else get(id).gl++;});
    });
    if(ms.done){
      ids.forEach(function(id){
        var p=get(id),won=team(id)===ms.winner;
        p.m++;if(won){p.mw++;}else{p.ml++;}
        p.form.push(won?'W':'L');
        if(!isSingles){
          var T=team(id),partner=ids[T*2]===id?ids[T*2+1]:ids[T*2];
          var pr=p.partners[partner]||(p.partners[partner]={w:0,l:0});
          if(won)pr.w++;else pr.l++;
        }
      });
    }
  });
  return{P:P,pairs:pairs};
}
function okMatch(m){return m&&m.id&&!m.del;}

var S={players:[],matches:[]};
var ui={tab:'matches',view:'list',mid:null,pid:null,shot:'',next:null,err:'',form:{}};

function loadLocal(){
  try{
    var d=localStorage.getItem('smashx_pro_data');
    if(d){
      var parsed=JSON.parse(d);
      S.players=parsed.players||[];
      S.matches=parsed.matches||[];
    } else {
      S.players=[
        {id:'p1',name:'Player One'},
        {id:'p2',name:'Player Two'},
        {id:'p3',name:'Player Three'},
        {id:'p4',name:'Player Four'}
      ];
    }
  }catch(e){}
}
function saveLocal(){
  try{localStorage.setItem('smashx_pro_data',JSON.stringify(S));}catch(e){}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function players(){return S.players.filter(function(p){return !p.del;});}
function liveMatches(){return S.matches.filter(function(m){return !m.del;});}
function nameOf(id){var p=S.players.find(function(x){return x.id===id;});return p?p.name:'Player';}
function teamName(m,T){return m.mode==='singles'?nameOf(m.tm[T]):nameOf(m.tm[T*2])+' & '+nameOf(m.tm[T*2+1]); }
function curMatch(){return S.matches.find(function(m){return m.id===ui.mid&&!m.del;});}

function matchCard(m){
  var ms=matchState(m),done=ms.done;
  var line=ms.games.filter(function(g){return g.n>0;}).map(function(g){return g.s[0]+'–'+g.s[1];}).join(' · ');
  return '<button class="mcard'+(done?'':' live')+'" data-act="open" data-id="'+m.id+'">'+
    '<div class="row sp small muted"><span>'+(m.venue?'@ '+esc(m.venue):'Match')+' · to '+m.tg+'</span><span>'+(done?'':'<span class="chip srv">Live</span>')+'</span></div>'+
    [0,1].map(function(T){return '<div class="tn'+(ms.winner===T?' win':'')+'"><span>'+esc(teamName(m,T))+'</span><span>'+ms.w[T]+'</span></div>';}).join('')+
    '<div class="sc">'+(line||'0–0')+'</div></button>';
}

function viewList(){
  var ms=liveMatches();
  var h='<h2>Matches</h2><div class="stack"><button class="btn primary block" data-act="new">New Match</button>';
  if(!ms.length){h+='<div class="card empty"><b>No Matches Yet</b><p class="muted">Add players and start a match!</p></div>';}
  else{h+=ms.map(matchCard).join('');}
  return h+'</div>';
}

function selOpts(sel){return '<option value="">Choose player…</option>'+players().map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+' ('+p.id+')</option>';}).join('');}

function viewNew(){
  var pl=players(),f=ui.form;
  if(!f.tg){f.tg='21';f.bo='3';f.sv='0';f.mode='doubles';f.venue='';}
  if(!f.a1&&pl.length>=2){f.a1=pl[0].id;f.b1=pl[1].id;}
  var h='<div class="row sp"><button class="btn sm" data-act="back">← Back</button></div><h2>New Match</h2><div class="stack">';
  h+='<div class="card stack"><div class="field"><label>Mode</label><div class="grid2"><button class="btn'+(f.mode!=='singles'?' primary':'')+'" data-act="setmode" data-m="doubles">Doubles</button><button class="btn'+(f.mode==='singles'?' primary':'')+'" data-act="setmode" data-m="singles">Singles</button></div></div>'+
     '<div class="field"><label>Venue</label><input type="text" id="f-venue" value="'+esc(f.venue)+'" placeholder="Court name"></div></div>';
  
  if(f.mode==='singles'){
    h+='<div class="card stack"><div class="field"><label>Player A</label><select id="f-a1">'+selOpts(f.a1)+'</select></div></div>';
    h+='<div class="card stack"><div class="field"><label>Player B</label><select id="f-b1">'+selOpts(f.b1)+'</select></div></div>';
  } else {
    h+='<div class="card stack"><div class="field"><label>Team A (P1 & P2)</label><div class="grid2"><select id="f-a1">'+selOpts(f.a1)+'</select><select id="f-a2">'+selOpts(f.a2)+'</select></div></div></div>';
    h+='<div class="card stack"><div class="field"><label>Team B (P1 & P2)</label><div class="grid2"><select id="f-b1">'+selOpts(f.b1)+'</select><select id="f-b2">'+selOpts(f.b2)+'</select></div></div></div>';
  }
  h+='<div class="card stack"><div class="grid2"><div class="field"><label>Points</label><select id="f-tg"><option value="21">21</option><option value="15">15</option></select></div>'+
     '<div class="field"><label>Best of</label><select id="f-bo"><option value="3">3</option><option value="1">1</option><option value="5">5</option></select></div></div></div>';
  if(ui.err)h+='<p class="err-msg">'+esc(ui.err)+'</p>';
  h+='<button class="btn primary block" data-act="start">Start Match</button></div>';
  return h;
}
function readForm(){
  var f=ui.form;
  [['a1','f-a1'],['a2','f-a2'],['b1','f-b1'],['b2','f-b2'],['tg','f-tg'],['bo','f-bo'],['venue','f-venue']].forEach(function(x){var el=document.getElementById(x[1]);if(el)f[x[0]]=el.value;});
}

function viewScore(){
  var m=curMatch();if(!m){ui.view='list';return viewList();}
  var ms=matchState(m),g=ms.cur,tg=m.tg,gi=m.g.length,over=g.over,isSingles=m.mode==='singles';
  var h='<div class="row sp"><button class="btn sm" data-act="back">← Back</button><span class="small muted">Game '+gi+'</span></div>';
  h+='<div class="board" style="margin-top:10px">'+[0,1].map(function(T){
    return '<div class="side '+(T===0?'a':'b')+'"><div class="lbl">'+esc(teamName(m,T))+'</div><div class="num">'+g.s[T]+'</div></div>';
  }).join('')+'</div>';
  
  if(!over){
    h+='<div class="card" style="margin:10px 0"><div class="shots">'+SHOTS.map(function(x){return '<button class="sc-btn'+(ui.shot===x[0]?' on':'')+'" data-act="shot" data-s="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div></div>';
  }
  
  [0,1].forEach(function(T){
    var ids=isSingles?[m.tm[T]]:[m.tm[T*2],m.tm[T*2+1]];
    h+='<div class="team '+(T===0?'a':'b')+'" style="margin-top:10px">'+ids.map(function(id){
      return '<div class="prow"><span class="pname">'+esc(nameOf(id))+'</span>'+
        '<button class="pbtn win" data-act="pt" data-p="'+id+'"'+(over?' disabled':'')+'>Pt</button>'+
        '<button class="pbtn err" data-act="er" data-p="'+id+'"'+(over?' disabled':'')+'>Err</button></div>';
    }).join('')+'</div>';
  });

  if(over&&!ms.done){
    h+='<div class="card stack" style="margin-top:12px"><button class="btn primary block" data-act="startnext">Start Next Game</button></div>';
  }
  h+='<div class="row" style="margin-top:12px"><button class="btn" data-act="undo">Undo</button><button class="btn" data-act="break">Break</button></div>';
  return h;
}

function viewPlayers(){
  var pl=players();
  var h='<h2>Players</h2><div class="stack"><form data-form="addp" class="card row" style="flex-wrap:nowrap"><input type="text" id="np" placeholder="Player name"><button class="btn primary" type="submit">Add</button></form>';
  pl.forEach(function(p){
    h+='<div class="card row sp"><b>'+esc(p.name)+'</b> <span class="chip">ID: '+p.id+'</span><button class="btn sm danger" data-act="rmp" data-id="'+p.id+'">X</button></div>';
  });
  return h+'</div>';
}

function viewStats(){
  var P=computeStats(liveMatches()).P;
  var h='<h2>Stats</h2><div class="stack">';
  players().forEach(function(p){
    var st=P[p.id]||{mw:0,ml:0,w:0,e:0};
    h+='<div class="card"><b>'+esc(p.name)+'</b><div class="small muted">Won: '+st.mw+' | Winners: '+st.w+' | Errors: '+st.e+'</div></div>';
  });
  return h+'</div>';
}

function render(){
  loadLocal();
  var v=document.getElementById('view');if(!v)return;
  var h;
  if(ui.tab==='matches'){h=ui.view==='new'?viewNew():ui.view==='match'?viewScore():viewList();}
  else if(ui.tab==='players'){h=viewPlayers();}
  else{h=viewStats();}
  v.innerHTML=h;
  ['matches','me','players','stats'].forEach(function(t){var b=document.getElementById('t-'+t);if(b){b.classList.toggle('on',ui.tab===t);}});
}
function go(tab,view){ui.tab=tab;ui.view=view||(tab==='matches'?'list':'');ui.err='';render();window.scrollTo(0,0);}

function addRally(pid,kind){
  var m=curMatch();if(!m)return;
  var ms=matchState(m);if(ms.cur.over)return;
  var isSingles=m.mode==='singles';
  var T=isSingles ? (m.tm[0]===pid?0:1) : (m.tm.indexOf(pid)<2?0:1);
  m.g[m.g.length-1].r.push((kind==='w'?T:1-T)+':'+pid+':'+kind+':'+(ui.shot||''));
  ui.shot='';saveLocal();render();
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'tab':go(b.dataset.v);break;
    case 'new':ui.view='new';render();break;
    case 'back':go('matches','list');break;
    case 'setmode':ui.form.mode=b.dataset.m;render();break;
    case 'start':
      readForm();var f=ui.form;
      var ids=f.mode==='singles'?[f.a1,f.b1]:[f.a1,f.a2,f.b1,f.b2];
      if(ids.some(function(x){return !x;})){ui.err='Select all players.';render();return;}
      var m={id:uid(),t:Date.now(),tg:+f.tg,bo:+f.bo,tm:ids,mode:f.mode,venue:f.venue,g:[{f:0,pos:ids,r:[]}]};
      S.matches.push(m);saveLocal();ui.mid=m.id;ui.view='match';render();
      break;
    case 'open':ui.mid=id;ui.view='match';render();break;
    case 'pt':addRally(b.dataset.p,'w');break;
    case 'er':addRally(b.dataset.p,'e');break;
    case 'shot':ui.shot=ui.shot===b.dataset.s?'':b.dataset.s;render();break;
    case 'break':curMatch().g[curMatch().g.length-1].r.push('0::b:');saveLocal();render();break;
    case 'undo':var mg=curMatch().g;var g=mg[mg.length-1];if(g.r.length)g.r.pop();saveLocal();render();break;
    case 'startnext':curMatch().g.push({f:0,pos:curMatch().tm,r:[]});saveLocal();render();break;
    case 'rmp':S.players=S.players.filter(function(x){return x.id!==id;});saveLocal();render();break;
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var inp=document.getElementById('np');
  if(inp&&inp.value.trim()){S.players.push({id:uid(),name:inp.value.trim()});saveLocal();render();}
});

render();
})();
</script>
</body></html>
