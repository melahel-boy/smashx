<style>
/* Layout: one-column phone app. Header, one working view at a time, fixed bottom tabs.
   Scoreboard in two team colors on a court-green ground; shuttle-yellow marks game point. */
:root{
  --bg:#EBF1EE; --surface:#FFFFFF; --surface2:#E1EAE5; --ink:#11231C; --muted:#586C63; --line:#C9D7D0;
  --accent:#0D7556; --accent-ink:#FFFFFF; --bad:#B8362A; --hi:#F2CF3D; --hi-ink:#2B2400;
  --ta:#2859D1; --ta-soft:#DDE6FA; --tb:#C9691A; --tb-soft:#F9E5D0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1714; --surface:#15231E; --surface2:#1E3029; --ink:#E8F1EC; --muted:#93A9A0; --line:#2A4036;
    --accent:#35C79A; --accent-ink:#06241B; --bad:#FF8577; --hi:#F2CF3D; --hi-ink:#2B2400;
    --ta:#8AA7FF; --ta-soft:#1B2A52; --tb:#F2A65E; --tb-soft:#46300F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1714; --surface:#15231E; --surface2:#1E3029; --ink:#E8F1EC; --muted:#93A9A0; --line:#2A4036;
  --accent:#35C79A; --accent-ink:#06241B; --bad:#FF8577; --hi:#F2CF3D; --hi-ink:#2B2400;
  --ta:#8AA7FF; --ta-soft:#1B2A52; --tb:#F2A65E; --tb-soft:#46300F; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font:500 16px/1.35 var(--body);
  padding-block:0 calc(66px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.hero{width:100%;height:auto;display:block;border-radius:12px;margin:0 0 10px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 0}
.brand{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;flex:none}
.brand svg{width:24px;height:24px;color:var(--accent);flex:none}
.sync{font-size:12px;color:var(--muted);text-align:right;min-width:0}
h2{font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:10px 0 8px;text-wrap:balance}
h3{font:700 14px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;min-height:44px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:3px}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
textarea{padding:10px 12px;min-height:90px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:700;line-height:1.5;white-space:nowrap}
.chip.srv{background:var(--accent);color:var(--accent-ink)}

.chip.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.chip.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}

.inl{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.inl input[type],.inl select{flex:1 1 0;min-width:0;width:auto}

.prw{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

.iconbtn svg{width:18px;height:18px}
.iconbtn:active{transform:scale(.94)}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot-card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}.slot-card b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}.slot-card select{min-height:38px}.slot-addmore{min-height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px dashed var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}.slot-addmore span{font-size:30px;line-height:1;font-weight:400}.slot-addmore small{font-size:11px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:18px}.modal-card{width:min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 16px 50px #0005}.slot-plus{width:100%;min-height:58px;border:1px dashed var(--accent);border-radius:10px;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-size:30px;line-height:1}.empty{text-align:center;padding:16px 12px}
.empty b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}

.mcard{display:grid;gap:4px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px}

.mcard .tn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .tn.win{font-weight:800}
.mcard .sc{font:700 20px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.live{border-color:var(--accent);box-shadow:inset 6px 0 0 var(--accent)}

/* Scoring */
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:14px;padding:6px 10px 8px;min-width:0}
.side.a,.team.a{--tc:var(--ta)}
.side.b,.team.b{--tc:var(--tb)}
.side .lbl{font-size:13px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font:800 96px/.95 var(--display);color:var(--tc);font-variant-numeric:tabular-nums}
.side .st{min-height:24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:6px 2px}
.team{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:14px;padding:4px 12px}
.teamboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start}.teamboard .team{min-width:0;padding:4px 8px}.prow{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;align-items:stretch;padding:8px 0}
.prow+.prow{border-top:1px solid var(--line)}
.pname{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:12.5px;color:var(--muted)}
.pbtn{width:100%;min-width:0;min-height:34px;padding:4px 8px;border-radius:9px;font-weight:800;font-size:12px;border:1px solid transparent;background:transparent}
.pbtn.win{background:var(--accent);color:var(--accent-ink)}
.pbtn.err{color:var(--bad);border-color:var(--bad)}
.pbtn:active{transform:scale(.96)}
.shots{display:flex;gap:6px;flex-wrap:wrap}
.sc-btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;min-height:38px;font-weight:700;font-size:14px}
.sc-btn.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:0}
.log li{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .s{font:700 17px/1.2 var(--display);letter-spacing:.04em;min-width:58px;font-variant-numeric:tabular-nums}
.log .ta{color:var(--ta)} .log .tb{color:var(--tb)}

/* Stats */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px}
.pcard .mg{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pcard .mg div{padding:6px}
.nw{white-space:nowrap}
.mg div{background:var(--surface2);border-radius:10px;padding:6px 8px;min-width:0}
.mg b{display:block;font:700 28px/1.05 var(--display);font-variant-numeric:tabular-nums}
.mg span{font-size:12px;color:var(--muted);font-weight:600}
.pcard{display:grid;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.pcard .nm{font-weight:800;font-size:18px;display:flex;justify-content:space-between;gap:8px}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.brow{display:grid;grid-template-columns:78px 1fr 34px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 5px;text-align:right;border-top:1px solid var(--line);font-size:14px}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:700}
.tbl th{font-size:12px;color:var(--muted);border-top:0}
.scroll-x{overflow-x:auto}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 12px}
summary{font-weight:700;cursor:pointer;min-height:26px}

/* Bottom tabs */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:4px max(12px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav div{max-width:560px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:1px;padding:4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);min-height:46px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent);background:var(--surface2)}
@media (prefers-reduced-motion:reduce){.btn:active,.pbtn:active,.iconbtn:active{transform:none}}
@media (max-width:380px){.num{font-size:80px}.pbtn{min-width:80px}}

.simple-teams{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.simple-team{border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;background:var(--surface);min-width:0}.simple-team.a{border-top:4px solid var(--ta)}.simple-team.b{border-top:4px solid var(--tb)}.simple-team .team-name{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.simple-team .big-score{font:800 clamp(64px,19vw,100px)/1 var(--display);font-variant-numeric:tabular-nums;margin:9px 0 5px}.simple-team .big-score.hot{color:var(--hi)}.simple-team.a .team-name{color:var(--ta)}.simple-team.b .team-name{color:var(--tb)}.simple-team .add-point{width:100%;min-height:54px;border:0;border-radius:12px;font-size:18px;font-weight:800;background:var(--surface2)}.simple-team.a .add-point{background:var(--ta-soft);color:var(--ta)}.simple-team.b .add-point{background:var(--tb-soft);color:var(--tb)}.simple-team .minus-point{border:0;background:transparent;color:var(--muted);font-size:23px;min-width:44px;min-height:40px}.simple-games{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:9px}.simple-games .game-count{background:var(--surface2);border-radius:10px;padding:6px 14px;font:700 25px/1 var(--display);min-width:58px;text-align:center}.simple-status{min-height:24px;text-align:center;margin:8px 0;color:var(--muted);font-size:13px;font-weight:700}.simple-modal{position:fixed;inset:0;background:#0009;z-index:30;display:grid;place-items:center;padding:20px}.simple-modal>div{width:min(100%,360px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;box-shadow:0 12px 44px #0004}.simple-modal h2{font-size:28px;margin:0 0 8px}.theme-swatches{display:flex;gap:10px;flex-wrap:wrap}.theme-swatch{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);padding:0}.theme-swatch[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}@media(max-width:380px){.simple-team{padding:8px 5px}.simple-team .big-score{font-size:64px}}

<script>
(function(){
'use strict';
/*CORE*/
var SHOTS=[['s','Smash'],['d','Drop'],['n','Net'],['v','Drive'],['l','Lob'],['x','Serve']];
var SHOT={};SHOTS.forEach(function(x){SHOT[x[0]]=x[1];});
var CAP={21:30,15:21,11:15};
function uid(){return Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6);}
function sessionUid(){try{var a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}catch(e){return uid()+uid()+uid()+uid();}}
function isOver(a,b,tg){var mx=Math.max(a,b);return (mx>=tg&&Math.abs(a-b)>=2)||mx>=(CAP[tg]||tg+9);}
function parseR(s){var a=String(s).split(':');return{t:+a[0],p:a[1],k:a[2],s:a[3]||''};}
/* pos = [A right, A left, B right, B left]. Index 0 of a team is the right court. */
/* Singles games have pos = [A, B]; the server's court follows their own score (even = right). */
function gameState(g,tg){
  g=g||{};var pos=Array.isArray(g.pos)?g.pos.slice():[];var rallies=Array.isArray(g.r)?g.r:[];
  if(pos.length!==2&&pos.length!==4)pos=['','','',''];

  var P=sg?[[pos[0]],[pos[1]]]:[[pos[0],pos[1]],[pos[2],pos[3]]];

  for(var i=0;i<rallies.length;i++){
    if(over)break;
    var r=parseR(g.r[i]);

  }
   var court=s[srv]%2===0?0:1,server=sg?P[srv][0]:P[srv][court],receiver=sg?P[1-srv][0]:P[1-srv][court];
return{s:s,srv:srv,server:server,receiver:receiver,P:P,over:over,winner:winner,n:n,sg:sg};
  }
/* Players on one side. Old matches have no type and four players, so they stay doubles. */
function teamIds(m,T){var ids=m&&Array.isArray(m.tm)?m.tm:[];if(!ids.length)return[];var per=Math.ceil(ids.length/2);return ids.slice(T*per,Math.min((T+1)*per,ids.length));}
/* Permanent display ID, derived from the player's permanent record id so old players need no migration. */
function pidFor(id){

function displayId(p){return p.pid||pidFor(p.id);}
function matchesQ(p,q){
  q=String(q||'').trim().toLowerCase();
  if(!q)return true;
  return String(p.name||'').toLowerCase().indexOf(q)>=0||displayId(p).toLowerCase().indexOf(q)>=0;

function wouldWin(st,t,tg){var s=st.s.slice();s[t]++;return isOver(s[0],s[1],tg);}
function matchState(m){m=m||{};m.g=Array.isArray(m.g)?m.g:[];m.tm=Array.isArray(m.tm)?m.tm:[];m.bo=Number(m.bo)||1;m.tg=Number(m.tg)||21;

function inc(o,k){o[k]=(o[k]||0)+1;}
function computeStats(matches){
  var P={},pairs={};
  function get(id){return P[id]||(P[id]={id:id,m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,f:0,tp:0,tl:0,sw:{},se:{},sf:{},form:[],partners:{}});}

  var list=matches.filter(function(m){return !m.del&&m.st!=='cancelled';}).sort(function(a,b){return a.t-b.t;});

async function joinSession(raw,role){
  try{

    if(mt)sid=decodeURIComponent(mt[1]);
    sid=sid.replace(/^.*\//,'');
    if(!sid){
      ui.joinError='Enter a Session ID or invite link.';
      render();return;
    }

    var d=await cloud.api.get('sessions',sid);
    if(!d){
      ui.joinError='Session not found. Check the ID or link.';
      render();return;
    }

    var chosen=role||'player';
    if(!cloud.user&&chosen==='spectator'){
      if(d.visibility!=='public'){ui.joinError='Only Public Sessions can be viewed as a guest. Sign in to join a Private Session.';render();return;}
      stopWatch();ui.guestSpectatorSid=sid;ui.sid=sid;ui.tab='matches';ui.view='session';ui.joinPrompt=false;ui.joinId='';
      S.sessions=mergeDocs(S.sessions,[d]);

      render();return;
    }
    var members=d.members||{};
    var requests=d.roleRequests||{};
    var ids=Array.isArray(d.memberUids)?d.memberUids.slice():[];

    if(chosen==='refereeRequest'){
      requests[meId()]='referee';
      members[meId()]='player';
    }else{
      members[meId()]=chosen;
    }

    if(ids.indexOf(meId())<0)ids.push(meId());

    d.memberUids=ids;
    d.members=members;
    d.roleRequests=requests;

    var myPlayer=S.players.find(function(p){
      return p&&p.uid===meId();
    });

    if(chosen==='player'){
      if(!myPlayer){
        var joinPid=uid();
        myPlayer={
          id:joinPid,
          pid:pidFor(joinPid),
          name:(cloud.user&&cloud.user.name)||'Player',
          uid:meId(),
          by:meId(),
          u:Date.now()

        await cloud.api.set('players',myPlayer.id,clean(myPlayer));
        S.players.push(myPlayer);
      }

      d.roster=sessionRoster(d);
      d.slots=Array.isArray(d.slots)?d.slots:[];

      var alreadySlot=d.slots.some(function(sl){
        return sl&&sl.playerId===myPlayer.id;

      if(!alreadySlot){
        var empty=d.slots.find(function(sl){
          return sl&&!sl.playerId;
        });

        if(empty){
          var emptyNo=empty.number;
          empty.playerId=myPlayer.id;
          empty.joinedAt=Date.now();

          (d.rounds||[]).forEach(function(rr){
            (rr.fixtures||[]).forEach(function(ff){
              if(!Array.isArray(ff.teams))return;
              [0,1].forEach(function(tt){
                ff.teams[tt]=(ff.teams[tt]||[]).map(function(x){
                  return x==='slot:'+emptyNo?myPlayer.id:x;
                });
              });
            });
          });
        }else if(!d.slots.length){
          d.slots.push({
            number:1,
            playerId:myPlayer.id,
            joinedAt:Date.now()
          });
          d.totalPlayers=1;
        }

        if(d.roster.indexOf(myPlayer.id)<0)d.roster.push(myPlayer.id);d.totalPlayers=Math.max(Number(d.totalPlayers)||0,d.slots.length);rescheduleSessionAfterRosterChange(d);
      }
    }

    else S.sessions.push(d);

    ui.sid=sid;
    ui.view='session';
    ui.joinId='';
    ui.joinPrompt=false;
    ui.err='';
    startWatch();
    render();

  }catch(e){
    console.error(e);
    ui.joinError='Could not join. Check the Session ID and Firebase Rules.';
    render();
  }
}
