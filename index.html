.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;

</style>

<script>
(function(){
'use strict';
function clearTransientBrowserData(){try{sessionStorage.clear();}catch(e){}}
clearTransientBrowserData();
window.addEventListener('pagehide',clearTransientBrowserData);
/* CORE RALLY & AUTO-ROTATION ENGINE */
var SHOTS=[['s','Smash'],['d','Drop'],['n','Net'],['v','Drive'],['l','Lob'],['x','Serve']];
var SHOT={};SHOTS.forEach(function(x){SHOT[x[0]]=x[1];});
var CAP={21:30,15:21,11:15};
function uid(){return Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6);}
function isOver(a,b,tg){var mx=Math.max(a,b);return (mx>=tg&&Math.abs(a-b)>=2)||mx>=(CAP[tg]||tg+9);}
function parseR(s){var a=String(s).split(':');return{t:+a[0],p:a[1],k:a[2],s:a[3]||''};}
function isSingles(m){ return m.sz=1 || (m.tm&&m.tm.length=2); }
/* Auto court positioning algorithm for doubles and singles */
function gameState(g,tg,isSinglesMatch){
var one = isSinglesMatch || g.pos.length=2;
var P = one ? [[g.pos[0]], [g.pos[1]]] : [[g.pos[0],g.pos[1]],[g.pos[2],g.pos[3]]];
var s=[0,0], srv=g.f, over=false, winner=-1, n=0;
for(var i=0; i<g.r.length; i++){
if(over) break;
var r=parseR(g.r[i]);
s[r.t]++; n++;
if(!one){
if(r.t=srv){ P[r.t]=[P[r.t][1],P[r.t][0]]; } else { srv=r.t; }
} else {
if(r.t!srv){ srv=r.t; }
}
if(isOver(s[0],s[1],tg)){ over=true; winner=s[0]>s[1]?0:1; }
}
var server = one ? P[srv][0] : P[srv][s[srv]%2=0?0:1];
return {s:s, srv:srv, server:server, P:P, over:over, winner:winner, n:n};
}
function wouldWin(st,t,tg){var s=st.s.slice();s[t]++;return isOver(s[0],s[1],tg);}
function matchState(m){
var need=Math.ceil(m.bo/2),w=[0,0],games=[];
var single = isSingles(m);
m.g.forEach(function(g){var st=gameState(g,m.tg,single);games.push(st);if(st.over)w[st.winner]++;});
var winner=w[0]>=need?0:(w[1]>=need?1:-1);
var cur=games[games.length-1];
return {games:games,w:w,need:need,winner:winner,done:winner>=0,cur:cur};
}
function inc(o,k){o[k]=(o[k]||0)+1;}
/* Persistent Stats logic: retains individual player stats even if match log is deleted from History */
function getPermStats(){
try{ return JSON.parse(localStorage.getItem('smashx_perm_stats')||'{}'); }catch(e){ return {}; }
}
function savePermStats(data){
try{ localStorage.setItem('smashx_perm_stats', JSON.stringify(data)); }catch(e){}
}
function recordMatchToPermStats(m){
var ms = matchState(m);
if(!ms.done) return;
var pdata = getPermStats();
if(!pdata[m.id]){
pdata[m.id] = { id: m.id, tm: m.tm.slice(), sz: m.sz, g: clone(m.g), winner: ms.winner };
savePermStats(pdata);
}
}
function computeStats(matches){
var P={},pairs={};
function get(id){return P[id]||(P[id]={id:id,m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,tp:0,tl:0,sw:{},se:{},form:[],partners:{}});}
var activeList = matches.filter(function(m){return !m.del;});
var permData = getPermStats();
var permList = Object.keys(permData).map(function(k){ return permData[k]; });
var combined = activeList.slice();
permList.forEach(function(pm){
if(!combined.some(function(x){ return x.id === pm.id; })){
combined.push(pm);
}
});
combined.forEach(function(m){
var ms=matchState(m),ids=m.tm||[];
var single = isSingles(m);
ids.forEach(get);
function team(id){return single?(ids.indexOf(id)===0?0:1):(ids.indexOf(id)<2?0:1);}
(m.g||[]).forEach(function(g,gi){
(g.r||[]).forEach(function(raw){
var r=parseR(raw);
ids.forEach(function(id){if(team(id)=r.t)get(id).tp++;else get(id).tl++;});
if(r.k='w'){get(r.p).w++;inc(get(r.p).sw,r.s||'-');}
else{get(r.p).e++;inc(get(r.p).se,r.s||'-');}
});
var st=ms.games[gi];
if(st&&st.over)ids.forEach(function(id){if(team(id)===st.winner)get(id).gw++;else get(id).gl++;});
});
if(ms.done){
ids.forEach(function(id){
var p=get(id),won=team(id)=ms.winner;
p.m++;if(won){p.mw++;}else{p.ml++;}
p.form.push(won?'W':'L');
if(!single){
var T=team(id),partner=ids[T2]===id?ids[T2+1]:ids[T2];
if(partner){
var pr=p.partners[partner]||(p.partners[partner]={w:0,l:0});
if(won)pr.w++;else pr.l++;
}
}
});
if(!single && ids.length>=4){
[0,1].forEach(function(T){
var pr=[ids[T2],ids[T*2+1]].sort(),key=pr.join('+');
var o=pairs[key]||(pairs[key]={ids:pr,w:0,l:0});
if(ms.winner=T)o.w++;else o.l++;
});
}
}
});
return{P:P,pairs:pairs};
}
function okMatch(m){
if(!m||!m.id)return false;
if(m.del)return true;
return Array.isArray(m.tm)&&(m.tm.length=2||m.tm.length=4)&&Array.isArray(m.g)&&m.g.length>0;
}
function clone(x){return JSON.parse(JSON.stringify(x));}
/* CONFIG */
var CONFIG={apiKey:"AIzaSyBDvfwzsRpsc4WALuL14i2SiuQMJXEhlDo",authDomain:"smashx-pro2026.firebaseapp.com",projectId:"smashx-pro2026",storageBucket:"",messagingSenderId:"726099778079",appId:""};
var S={players:[],matches:[],sessions:[]};
var cloud={api:null,user:null,pending:false,fromCache:true,meTried:false,stops:[]};
var ui={tab:'matches',view:'list',mid:null,pid:null,shot:'',next:null,err:'',edit:null,confirm:null,form:{},sessionForm:{},sid:null,auth:'loading'};
function clean(o){return JSON.parse(JSON.stringify(o));}
function authMsg(e){
var c=(e&&e.code)||'';
if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return 'Sign-in was cancelled.';
if(c==='auth/popup-blocked')return 'Pop-up blocked. Allow pop-ups and try again.';
return 'Sign-in did not work. Check internet and try again.';
}
function syncText(){
if(!cloud.user)return '';
if(cloud.pending)return 'Backing up…';
if(cloud.fromCache)return 'Connecting…';
return 'Backed up';
}
function updSync(){var el=document.getElementById('sync');if(el)el.textContent=syncText();}
function writeErr(e){ui.err=(e&&e.code==='permission-denied')?'Permission denied.':'Could not save.';render();}
function touchP(p){p.u=Date.now();cloud.api.set('players',p.id,clean(p)).catch(writeErr);render();}
function touchM(m){
m.u=Date.now();m.pids=(m.tm||[]).slice();
recordMatchToPermStats(m);
cloud.api.set('matches',m.id,clean(m)).catch(writeErr);
}
function touchSession(x){
x.u=Date.now();
return cloud.api.set('sessions',x.id,clean(x)).catch(writeErr);
}
function stopWatch(){cloud.stops.forEach(function(f){try{f();}catch(e){}});cloud.stops=[];}
function startWatch(){
stopWatch();
cloud.stops.push(cloud.api.watch('players',function(docs,md){
S.players=docs.filter(function(p){return p&&p.id&&typeof p.name==='string';});
cloud.pending=md.hasPendingWrites;cloud.fromCache=md.fromCache;
ensureMe();safeRender();updSync();
},function(){ui.err='Could not load players.';}));
cloud.stops.push(cloud.api.watch('matches',function(docs,md){
S.matches=docs.filter(okMatch);
S.matches.forEach(recordMatchToPermStats);
cloud.pending=md.hasPendingWrites;cloud.fromCache=md.fromCache;
safeRender();updSync();
},function(){ui.err='Could not load matches.';}));
cloud.stops.push(cloud.api.watch('sessions',function(docs,md){
S.sessions=docs.filter(function(x){return x&&x.id&&!x.del;});
cloud.pending=md.hasPendingWrites;cloud.fromCache=md.fromCache;safeRender();updSync();
},function(){ui.err='Could not load sessions.';}));
}
function ensureMe(){
var u=cloud.user;if(!u||cloud.meTried||cloud.fromCache)return;
if(S.players.some(function(p){return p.id===u.uid;})){cloud.meTried=true;return;}
cloud.meTried=true;
