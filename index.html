function nameOf(id){var p=S.players.find(function(x){return x.id===id;});return p?p.name:'Player';}
function teamName(m,T){
  if(m.mode==='singles'){return nameOf(m.tm[T]);}
  return nameOf(m.tm[T*2])+' & '+nameOf(m.tm[T*2+1]);
}
function curMatch(){return S.matches.find(function(m){return m.id===ui.mid&&!m.del;});}
function fmtDate(t){try{return new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});}catch(e){return '';}}
function pct(a,b){return b?Math.round(a*100/b)+'%':'–';}
function signed(n){return (n>0?'+':'')+n;}
function scoreLine(ms){return ms.games.filter(function(g){return g.n>0;}).map(function(g){return g.s[0]+'–'+g.s[1];}).join('  ·  ');}
function courtOf(st,T,id,isSingles){if(isSingles)return '';return st.P[T].indexOf(id)===0?'Right court':'Left court';}
function meId(){return cloud.user?cloud.user.uid:'';}
function gameStatsFor(g){var o={};g.r.forEach(function(raw){var r=parseR(raw);if(r.k==='b')return;var x=o[r.p]||(o[r.p]={w:0,e:0});if(r.k==='w')x.w++;else x.e++;});return o;}
function rallyLines(m,g,st){
  var s=[0,0],out=[];
  g.r.forEach(function(raw,i){
    var r=parseR(raw);if(r.k==='b'){out.push({sc:s[0]+'–'+s[1],t:0,text:'☕ Break taken'});return;}
    s[r.t]++;
    var what=(r.k==='w'?'winner':'error')+(r.s&&r.s!=='b'?' · '+SHOT[r.s].toLowerCase():'');
    out.push({sc:s[0]+'–'+s[1],t:r.t,text:nameOf(r.p)+' '+what});
  });
  return out;
}
function keepAwake(){try{if(!window.__wl&&navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){window.__wl=l;l.addEventListener('release',function(){window.__wl=null;});}).catch(function(){});}}catch(e){}}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}}

function matchCard(m){
  var ms=matchState(m),done=ms.done;
  var line=ms.games.filter(function(g){return g.n>0;}).map(function(g){return g.s[0]+'–'+g.s[1];}).join(' · ');
  return '<button class="mcard'+(done?'':' live')+'" data-act="open" data-id="'+m.id+'">'+
    '<div class="row sp small muted"><span>'+esc(fmtDate(m.t))+(m.venue?' @ '+esc(m.venue):'')+' · to '+m.tg+'</span><span>'+(done?'':'<span class="chip srv">In progress</span>')+'</span></div>'+
    [0,1].map(function(T){return '<div class="tn'+(ms.winner===T?' win':'')+'"><span>'+esc(teamName(m,T))+'</span><span>'+(ms.winner===T?'Won ':'')+ms.w[T]+'</span></div>';}).join('')+
    '<div class="sc">'+(line||'0–0')+'</div></button>';
}

function viewList(){
  var ms=liveMatches().sort(function(a,b){return b.t-a.t;});
  var prog=ms.filter(function(m){return !matchState(m).done;});
  var done=ms.filter(function(m){return matchState(m).done;});
  var h='<h2>Matches & Sessions</h2><div class="stack">';
  h+='<button class="btn primary block" data-act="new">New match / session</button>';
  if(!ms.length){
    h+=emptyCard('Keep score. Know your game.','Add players, then start a match with custom settings, venue, and referees.','<button class="btn" data-act="tab" data-v="players">Add players</button>');
  }
  if(prog.length){h+='<h3>In progress</h3>'+prog.map(matchCard).join('');}
  if(done.length){h+='<h3>Finished</h3>'+done.map(matchCard).join('');}
  return h+'</div>';
}

function selOpts(sel){return '<option value="">Choose player ID / Name…</option>'+players().map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+' ('+p.id+')</option>';}).join('');}

function viewNew(){
  var pl=players(),f=ui.form;
  var h='<div class="row sp"><button class="btn sm" data-act="back">← Matches</button></div><h2>New Match Setup</h2>';
  if(!f.tg){f.tg='21';f.bo='3';f.sv='0';f.mode='doubles';f.venue='';f.refA='';f.refB=''}
  if(!f.a1&&pl.length>=2){f.a1=pl[0].id;f.b1=pl[1].id;}
  h+='<div class="stack">';
  h+='<div class="card stack"><div class="field"><label>Match Mode</label><div class="grid2"><button class="btn'+(f.mode!=='singles'?' primary':'')+'" data-act="setmode" data-m="doubles">Doubles (4 players)</button><button class="btn'+(f.mode==='singles'?' primary':'')+'" data-act="setmode" data-m="singles">Singles (2 players)</button></div></div>'+
     '<div class="field"><label>Venue / Location</label><input type="text" id="f-venue" value="'+esc(f.venue||'')+'" placeholder="e.g. Indoor Badminton Court Bangalore" maxlength="40"></div></div>';
  
  if(f.mode==='singles'){
    h+='<div class="card stack"><div class="field"><label>Player A</label><select id="f-a1">'+selOpts(f.a1)+'</select></div></div>';
    h+='<div class="card stack"><div class="field"><label>Player B</label><select id="f-b1">'+selOpts(f.b1)+'</select></div></div>';
  } else {
    h+='<div class="card stack"><div class="row sp"><b style="color:var(--ta)">Team A</b></div>'+
       '<div class="grid2"><div class="field"><label>Player 1</label><select id="f-a1">'+selOpts(f.a1)+'</select></div><div class="field"><label>Player 2</label><select id="f-a2">'+selOpts(f.a2)+'</select></div></div></div>';
    h+='<div class="card stack"><div class="row sp"><b style="color:var(--tb)">Team B</b></div>'+
       '<div class="grid2"><div class="field"><label>Player 1</label><select id="f-b1">'+selOpts(f.b1)+'</select></div><div class="field"><label>Player 2</label><select id="f-b2">'+selOpts(f.b2)+'</select></div></div></div>';
  }

  function opt(v,l,cur){return '<option value="'+v+'"'+(String(cur)===String(v)?' selected':'')+'>'+l+'</option>';}
  h+='<div class="card stack"><div class="grid2">'+
     '<div class="field"><label>Game to</label><select id="f-tg">'+opt(21,'21 points',f.tg)+opt(15,'15 points',f.tg)+opt(11,'11 points',f.tg)+'</select></div>'+
     '<div class="field"><label>Best of Games</label><select id="f-bo">'+opt(1,'1 game',f.bo)+opt(3,'Best of 3',f.bo)+opt(5,'Best of 5',f.bo)+opt(7,'Best of 7',f.bo)+'</select></div></div>'+
     '<div class="field"><label>Serves first</label><select id="f-sv">'+opt(0,'Team A',f.sv)+opt(1,'Team B',f.sv)+'</select></div>'+
     '<div class="grid2"><div class="field"><label>Referee (Team A side)</label><select id="f-refa">'+selOpts(f.refA)+'</select></div>'+
     '<div class="field"><label>Referee (Team B side)</label><select id="f-refb">'+selOpts(f.refB)+'</select></div></div></div>';
  if(ui.err)h+='<p class="err-msg">'+esc(ui.err)+'</p>';
  h+='<button class="btn primary block" data-act="start">Start Match</button></div>';
  return h;
}
function readForm(){
  var f=ui.form;
  [['a1','f-a1'],['a2','f-a2'],['b1','f-b1'],['b2','f-b2'],['tg','f-tg'],['bo','f-bo'],['sv','f-sv'],['venue','f-venue'],['refA','f-refa'],['refB','f-refb']].forEach(function(x){var el=document.getElementById(x[1]);if(el)f[x[0]]=el.value;});
}

function teamCard(m,ms,T,gs,over){
  var g=ms.cur,tg=m.tg,cls=T===0?'a':'b',isSingles=m.mode==='singles';
  var ids=isSingles ? [m.tm[T]] : [m.tm[T*2],m.tm[T*2+1]];
  var rows=ids.map(function(id){
    var x=gs[id]||{w:0,e:0},isSrv=!over&&g.srv===T&&g.server===id;
    return '<div class="prow"><div style="min-width:0"><div class="row" style="gap:6px;flex-wrap:nowrap"><span class="pname">'+esc(nameOf(id))+'</span>'+(isSrv?'<span class="chip srv">Serving</span>':'')+'</div>'+
      '<div class="pmeta">'+(!isSingles?'<span class="nw">'+courtOf(g,T,id,isSingles)+'</span> · ':'')+'<span class="nw">'+x.w+' won · '+x.e+' err</span></div></div>'+
      '<button class="pbtn win" data-act="pt" data-p="'+id+'"'+(over?' disabled':'')+'>Point</button>'+
      '<button class="pbtn err" data-act="er" data-p="'+id+'"'+(over?' disabled':'')+'>Error</button></div>';
  }).join('');
  return '<div class="team '+cls+'">'+rows+'</div>';
}

function viewScore(){
  var m=curMatch();
  if(!m){ui.view='list';return viewList();}
  keepAwake();
  var ms=matchState(m),g=ms.cur,tg=m.tg,gi=m.g.length,over=g.over,isSingles=m.mode==='singles';
  var gs=gameStatsFor(m.g[gi-1]);
  var gp=[0,1].map(function(T){return !over&&wouldWin(g,T,tg);});
  var h='<div class="row sp"><button class="btn sm" data-act="back">← Matches</button><span class="small muted">'+(ms.done?'Match complete':'Game '+gi)+'</span></div>';
  if(m.venue)h+='<div class="small muted" style="margin-top:4px">📍 Venue: <b>'+esc(m.venue)+'</b>'+(m.refA||m.refB?' | Referees: '+esc(nameOf(m.refA))+' & '+esc(nameOf(m.refB)):'')+'</div>';
  
  h+='<div class="board" style="margin-top:10px">'+[0,1].map(function(T){
    var chips='';
    if(!over&&g.srv===T)chips+='<span class="chip srv">Serving</span>';
    if(gp[T])chips+='<span class="chip hi">'+(ms.w[T]+1>=ms.need?'Match point':'Game point')+'</span>';
    return '<div class="side '+(T===0?'a':'b')+'"><div class="lbl">'+(T===0?'A':'B')+' · '+esc(teamName(m,T))+'</div><div class="num">'+g.s[T]+'</div><div class="st">'+chips+'</div></div>';
  }).join('')+'</div>';
  h+='<div class="gline"><span>First to '+tg+' (Win by 2)</span><span>Games '+ms.w[0]+'–'+ms.w[1]+'</span></div>';
  
  if(!over){
    h+='<div class="card" style="margin-bottom:12px"><div class="small muted" style="margin-bottom:6px">Shot / Action Type</div><div class="shots">'+
      SHOTS.map(function(x){return '<button class="sc-btn'+(ui.shot===x[0]?' on':'')+'" data-act="shot" data-s="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div></div>';
  }
  h+='<div class="stack">'+teamCard(m,ms,0,gs,over)+teamCard(m,ms,1,gs,over)+'</div>';

  if(over&&!ms.done){
    var nx=ui.next;
    if(!nx||nx.mid!==m.id||nx.n!==gi){var lg=m.g[gi-1];nx=ui.next={mid:m.id,n:gi,f:g.winner,pos:lg.pos.slice()};}
    h+='<div class="card stack" style="margin-top:12px;border-color:var(--accent)"><div><b>Game '+gi+' won by '+esc(teamName(m,g.winner))+'</b></div>'+
      '<div class="field"><label>Serves first next game</label><div class="grid2"><button class="btn'+(nx.f===0?' primary':'')+'" data-act="nserve" data-t="0">Team A</button><button class="btn'+(nx.f===1?' primary':'')+'" data-act="nserve" data-t="1">Team B</button></div></div>'+
      '<button class="btn primary block" data-act="startnext">Start Game '+(gi+1)+'</button></div>';
  }
  if(ms.done){
    h+='<div class="card stack" style="margin-top:12px;border-color:var(--accent)"><div><b>'+esc(teamName(m,ms.winner))+' won the match!</b></div><button class="btn primary block" data-act="detail" data-id="'+m.id+'">View Match Stats</button></div>';
  }
  var canUndo=m.g.length>1||m.g[0].r.length>0;
  h+='<div class="row" style="margin:12px 0"><button class="btn" data-act="undo"'+(canUndo?'':' disabled')+'>↶ Undo Last Action</button><button class="btn" data-act="break">☕ Take Break</button></div>';
  
  var lines=rallyLines(m,m.g[gi-1],g).slice(-6).reverse();
  if(lines.length){
    h+='<h3>Recent Activity</h3><div class="card"><ul class="log">'+lines.map(function(l){return '<li><span class="s '+(l.t===0?'ta':'tb')+'">'+l.sc+'</span><span>'+esc(l.text)+'</span></li>';}).join('')+'</ul></div>';
  }
  return h;
}

function viewDetail(){
  var m=curMatch();
  if(!m){ui.view='list';return viewList();}
  var ms=matchState(m),st=computeStats([m]).P,isSingles=m.mode==='singles';
  var h='<div class="row sp"><button class="btn sm" data-act="back">← Matches</button><span class="small muted">'+esc(fmtDate(m.t))+(m.venue?' @ '+esc(m.venue):'')+'</span></div>';
  h+='<h2>'+(ms.done?esc(teamName(m,ms.winner))+' won':'In progress')+'</h2>';
  h+='<div class="stack"><div class="card stack">'+[0,1].map(function(T){return '<div class="row sp"><b style="color:var(--'+(T?'tb':'ta')+')">'+esc(teamName(m,T))+'</b><span style="font:800 26px/1 var(--display)">'+ms.w[T]+'</span></div>';}).join('')+
    '<div class="small muted">'+(scoreLine(ms)||'No points yet')+'</div></div>';
  h+='<div class="card scroll-x"><table class="tbl"><thead><tr><th>Player</th><th>Winners</th><th>Errors</th><th>Net</th><th>Smash</th></tr></thead><tbody>'+
    m.tm.map(function(id){var p=st[id]||{w:0,e:0,sw:{}};return '<tr><td>'+esc(nameOf(id))+' ('+id+')</td><td>'+p.w+'</td><td>'+p.e+'</td><td>'+signed(p.w-p.e)+'</td><td>'+(p.sw.s||0)+'</td></tr>';}).join('')+
    '</tbody></table></div>';
  
  h+='<div class="row"><button class="btn primary" data-act="resume" data-id="'+m.id+'">'+(ms.done?'Review scoring':'Resume scoring')+'</button>'+
    (ui.confirm==='del:'+m.id?'<button class="btn danger" data-act="delmatch" data-id="'+m.id+'">Tap again to Confirm Delete</button>':'<button class="btn danger" data-act="delmatch" data-id="'+m.id+'">Delete Match</button>')+'</div></div>';
  return h;
}

function viewPlayers(){
  var pl=players(),st=computeStats(liveMatches()).P;
  var h='<h2>Players & Unique IDs</h2><div class="stack">';
  h+='<form data-form="addp" class="card row" style="flex-wrap:nowrap"><input type="text" id="np" placeholder="Add player name" maxlength="24" autocomplete="off"><button class="btn primary" type="submit">Add</button></form>';
  if(ui.err)h+='<p class="err-msg">'+esc(ui.err)+'</p>';
  if(!pl.length)h+=emptyCard('No players yet','Add players to generate unique IDs for matches.','');
  pl.forEach(function(p){
    var s=st[p.id]||{m:0,mw:0};
    h+='<div class="card stack"><div class="row sp"><div style="min-width:0"><b>'+esc(p.name)+'</b> <span class="chip srv">ID: '+p.id+'</span><div class="small muted">'+s.m+' match'+(s.m===1?'':'es')+' · '+pct(s.mw,s.m)+' won</div></div>'+
      '<button class="btn sm danger" data-act="rmp" data-id="'+p.id+'">Remove</button></div></div>';
  });
  h+='<h3>Account</h3><div class="card stack"><p class="small muted">Signed in as <b>'+esc(cloud.user?cloud.user.name:'')+'</b>.</p><div class="row"><button class="btn sm" data-act="signout">Sign out</button></div></div>';
  return h+'</div>';
}

function metric(v,l){return '<div><b>'+v+'</b><span>'+l+'</span></div>';}
function viewStats(){
  var res=computeStats(liveMatches()),P=res.P;
  var pl=players().map(function(p){return Object.assign({name:p.name},P[p.id]||{id:p.id,m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,tp:0,tl:0,sw:{},se:{},form:[],partners:{}});});
  var any=pl.some(function(p){return p.w+p.e>0;});
  pl.sort(function(a,b){var ra=a.m?a.mw/a.m:-1,rb=b.m?b.mw/b.m:-1;return rb-ra||b.mw-a.mw||(b.w-b.e)-(a.w-a.e);});
  var h='<h2>Player Stats</h2><div class="stack">';
  if(!any){h+=emptyCard('No points yet','Score a match to see individual leaderboards.','<button class="btn primary" data-act="tab" data-v="matches">Go to matches</button>');return h+'</div>';}
  pl.forEach(function(p){
    h+='<div class="pcard"><div><b>'+esc(p.name)+'</b> <span class="small muted">ID: '+p.id+'</span></div>'+
      '<div class="mg">'+metric(p.mw+'–'+p.ml,'Won–lost')+metric(p.w,'Winners')+metric(p.e,'Errors')+metric(signed(p.w-p.e),'Net')+'</div></div>';
  });
  return h+'</div>';
}
function viewMe(){
  var P=computeStats(liveMatches()).P,me=meId();
  var myRec=P[me]||{m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,tp:0,tl:0,sw:{},se:{},form:[]};
  var h='<h2>My Stats</h2><div class="stack"><div class="card stack"><div class="mg">'+metric(myRec.mw+'–'+myRec.ml,'Won–lost')+metric(myRec.w,'Winners')+metric(myRec.e,'Errors')+metric(signed(myRec.w-myRec.e),'Net')+'</div></div></div>';
  return h;
}
function viewAuth(){
  if(ui.auth==='loading')return '<div class="card empty" style="margin-top:20px"><b>Loading…</b></div>';
  return '<div class="card empty" style="margin-top:20px"><b>SmashX Pro</b><p class="muted">Sign in with Google to sync matches and player stats in real time.</p><div style="margin-top:16px"><button class="btn primary block" data-act="signin">Sign in with Google</button></div></div>';
}

function render(){
  var v=document.getElementById('view');if(!v)return;
  var nav=document.querySelector('.nav');
  if(ui.auth!=='in'){nav.hidden=true;v.innerHTML=viewAuth();updSync();return;}
  nav.hidden=false;
  var h;
  if(ui.tab==='matches'){
    h=ui.view==='new'?viewNew():ui.view==='match'?viewScore():ui.view==='detail'?viewDetail():viewList();
  }else if(ui.tab==='me'){h=viewMe();}else if(ui.tab==='players'){h=viewPlayers();}
  else{h=viewStats();}
  v.innerHTML=h;
  ['matches','me','players','stats'].forEach(function(t){var b=document.getElementById('t-'+t);if(b){b.classList.toggle('on',ui.tab===t);}});
  updSync();
}
function go(tab,view){ui.tab=tab;ui.view=view||(tab==='matches'?'list':tab==='stats'?'stats':'');ui.err='';ui.confirm=null;render();window.scrollTo(0,0);}

function addRally(pid,kind){
  var m=curMatch();if(!m)return;
  var ms=matchState(m);if(ms.cur.over)return;
  var isSingles=m.mode==='singles';
  var T=isSingles ? (m.tm[0]===pid?0:1) : (m.tm.indexOf(pid)<2?0:1);
  var scoring=kind==='w'?T:1-T;
  m.g[m.g.length-1].r.push(scoring+':'+pid+':'+kind+':'+(ui.shot||''));
  ui.shot='';buzz();touchM(m);render();
}
function addBreak(){
  var m=curMatch();if(!m)return;
  m.g[m.g.length-1].r.push('0::b:');
  touchM(m);render();
}
function undo(){
  var m=curMatch();if(!m)return;
  var g=m.g[m.g.length-1];
  if(!g.r.length&&m.g.length>1){m.g.pop();g=m.g[m.g.length-1];}
  if(g.r.length)g.r.pop();
  ui.next=null;touchM(m);render();
}
function addPlayer(name){
  name=(name||'').trim();
  if(!name){ui.err='Type a name first.';return false;}
  var p={id:uid(),name:name,uid:null,by:meId(),u:Date.now()};S.players.push(p);touchP(p);ui.err='';return true;
}
function startMatch(){
  readForm();
  var f=ui.form,isSingles=f.mode==='singles';
  var ids=isSingles?[f.a1,f.b1]:[f.a1,f.a2,f.b1,f.b2];
  if(ids.some(function(x){return !x;})||new Set(ids).size<ids.length){ui.err='Please select valid unique players.';render();return;}
  var m={id:uid(),t:Date.now(),u:Date.now(),tg:+f.tg,bo:+f.bo,tm:ids,mode:f.mode||'doubles',venue:f.venue||'',refA:f.refA||'',refB:f.refB||'',by:meId(),pids:ids.slice(),g:[{f:+f.sv,pos:ids.slice(),r:[]}]};
  S.matches.push(m);touchM(m);ui.mid=m.id;ui.view='match';ui.err='';ui.shot='';render();window.scrollTo(0,0);
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'tab':go(b.dataset.v);break;
    case 'signin':cloud.api.signIn().catch(function(e){ui.err=authMsg(e);render();});break;
    case 'signout':cloud.api.signOut().catch(function(){});break;
    case 'new':ui.err='';ui.view='new';render();window.scrollTo(0,0);break;
    case 'back':go('matches','list');break;
    case 'setmode':ui.form.mode=b.dataset.m;render();break;
    case 'start':startMatch();break;
    case 'open':{ui.mid=id;var m=curMatch();ui.view=m&&(matchState(m).done||m.by!==meId())?'detail':'match';ui.shot='';ui.next=null;render();window.scrollTo(0,0);break;}
    case 'detail':ui.mid=id;ui.view='detail';render();window.scrollTo(0,0);break;
    case 'resume':ui.mid=id;ui.view='match';ui.next=null;render();window.scrollTo(0,0);break;
    case 'pt':addRally(b.dataset.p,'w');break;
    case 'er':addRally(b.dataset.p,'e');break;
    case 'shot':ui.shot=ui.shot===b.dataset.s?'':b.dataset.s;render();break;
    case 'break':addBreak();break;
    case 'undo':undo();break;
    case 'nserve':if(ui.next){ui.next.f=+b.dataset.t;render();}break;
    case 'startnext':{var m2=curMatch();if(m2&&ui.next){m2.g.push({f:ui.next.f,pos:ui.next.pos.slice(),r:[]});ui.next=null;ui.shot='';touchM(m2);render();window.scrollTo(0,0);}break;}
    case 'delmatch':{
      if(ui.confirm!=='del:'+id){ui.confirm='del:'+id;render();break;}
      var dm=S.matches.find(function(x){return x.id===id;});
      if(dm){dm.del=1;dm.g=[];touchM(dm);}
      ui.confirm=null;ui.mid=null;go('matches','list');break;
    }
    case 'rmp':{
      var rp=S.players.find(function(x){return x.id===id;});
      if(rp){rp.del=1;touchP(rp);}
      render();break;
    }
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  if(f.dataset.form==='addp'){
    if(ui.tab==='matches')readForm();
    var inp=document.getElementById('np');
    addPlayer(inp?inp.value:'');
    render();
  }
});

render();
bootCloud().catch(function(){ui.auth='out';ui.err='Cloud error.';render();});
})();
</script>
</body></html>
