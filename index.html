function updateStatsForMatch(m) {
  var ms = matchState(m);
  if(!ms.done) return;
  if(S.permanentStats[m.id]) return; // Already recorded
  
  S.permanentStats[m.id] = {

function clone(x){ return JSON.parse(JSON.stringify(x)); }

function parseR(s){ var a=String(s).split(':'); return{t:+a[0], p:a[1], k:a[2], s:a[3]||''}; }
function isOver(a,b,tg){ var mx=Math.max(a,b); return (mx>=tg&&Math.abs(a-b)>=2)||mx>=(CAP[tg]||tg+9); }

function gameState(g,tg){
  var isSingle = g.pos.length === 2;
  var P = isSingle ? [[g.pos[0]],[g.pos[1]]] : [[g.pos[0],g.pos[1]],[g.pos[2],g.pos[3]]];
  var s=[0,0], srv=g.f, over=false, winner=-1, n=0;
  for(var i=0; i<(g.r||[]).length; i++){
    if(over) break;
    var r=parseR(g.r[i]);
    s[r.t]++; n++;
    if(!isSingle && r.t===srv){ P[r.t]=[P[r.t][1],P[r.t][0]]; } else if(r.t!==srv){ srv=r.t; }
    if(isOver(s[0],s[1],tg)){ over=true; winner=s[0]>s[1]?0:1; }
  }
  var server = isSingle ? P[srv][0] : P[srv][s[srv]%2===0?0:1];
  return {s:s, srv:srv, server:server, P:P, over:over, winner:winner, n:n};
}

function matchState(m){
  var need = Math.ceil((m.bo||3)/2), w=[0,0], games=[];
  (m.g||[]).forEach(function(g){
    var st = gameState(g, m.tg||21);
    games.push(st);
    if(st.over) w[st.winner]++;
  });
  var winner = w[0]>=need ? 0 : (w[1]>=need ? 1 : -1);
  var closed = m.st === 'stopped' || m.st === 'cancelled';
  return {games:games, w:w, need:need, winner:winner, done: winner>=0 || closed, cur: games[games.length-1]};
}

function computeStats(){
  var P={}, pairs={};
  function get(id){ return P[id]||(P[id]={id:id, m:0, mw:0, ml:0, gw:0, gl:0, w:0, e:0, tp:0, tl:0, sw:{}, se:{}, form:[]}); }
  
  // Combine current active matches + permanently stored past match stats
  var allRecorded = S.matches.filter(function(m){ return !m.del; });
  
  allRecorded.forEach(function(m){
    var ms = matchState(m);
    var ids = m.tm || [];
    ids.forEach(get);
    function team(id){ return m.sz===1 ? (ids.indexOf(id)===0?0:1) : (ids.indexOf(id)<2?0:1); }

    (m.g||[]).forEach(function(g, gi){
      (g.r||[]).forEach(function(raw){
        var r = parseR(raw);
        ids.forEach(function(id){ if(team(id)===r.t) get(id).tp++; else get(id).tl++; });
        if(r.k==='w'){ get(r.p).w++; get(r.p).sw[r.s||'-']=(get(r.p).sw[r.s||'-']||0)+1; }
        else { get(r.p).e++; get(r.p).se[r.s||'-']=(get(r.p).se[r.s||'-']||0)+1; }
      });
      var st = ms.games[gi];
      if(st && st.over) ids.forEach(function(id){ if(team(id)===st.winner) get(id).gw++; else get(id).gl++; });
    });

    if(ms.done){
      ids.forEach(function(id){
        var p=get(id), won = team(id)===ms.winner;
        p.m++; if(won) p.mw++; else p.ml++;
        p.form.push(won?'W':'L');
      });
    }
  });

  return {P:P, pairs:pairs};
}

function nameOf(id){ var p=S.players.find(function(x){return x.id===id;}); return p?p.name:'Player'; }
