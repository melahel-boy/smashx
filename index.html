<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmashX</title>
<meta name="theme-color" content="#031021">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1714; --surface:#15231E; --surface2:#1E3029; --ink:#E8F1EC; --muted:#93A9A0; --line:#2A4036;
  --accent:#35C79A; --accent-ink:#06241B; --bad:#FF8577; --hi:#F2CF3D; --hi-ink:#2B2400;
  --ta:#8AA7FF; --ta-soft:#1B2A52; --tb:#F2A65E; --tb-soft:#46300F;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font:500 16px/1.4 var(--body);
  padding-block:0 92px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.hero{width:100%;height:auto;display:block;border-radius:12px;margin:0 0 14px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px}
.brand{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;flex:none}
.sync{font-size:12px;color:var(--muted);text-align:right;min-width:0}
h2{font:700 24px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:18px 0 10px}
h3{font:700 14px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:48px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:active{transform:scale(.98)}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
select,input[type=text],input[type=date],input[type=time]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:700;line-height:1.5;white-space:nowrap}
.chip.srv{background:var(--accent);color:var(--accent-ink)}
.chip.hi{background:var(--hi);color:var(--hi-ink)}
.err-msg{color:var(--bad);font-weight:600;font-size:14px}
.empty{text-align:center;padding:26px 16px}
.empty b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}
.mcard{display:grid;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mcard .tn{font-weight:600;display:flex;justify-content:space-between;gap:8px;min-width:0}
.mcard .tn.win{font-weight:800}
.mcard .sc{font:700 20px/1 var(--display);letter-spacing:.04em}
.player-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.player-row:last-child{border-bottom:0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav div{max-width:560px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent);background:var(--surface2)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <div class="brand">
      <img src="logo-mark.png" alt="SmashX" width="34" height="34" style="border-radius:8px;flex:none;object-fit:cover" onerror="this.style.display='none'">
      SmashX
    </div>
    <div class="sync" id="sync"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="Main" id="main-nav" hidden>
  <div>
    <button data-act="tab" data-v="matches" id="t-matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M3 12h18"/></svg>Matches</button>
    <button data-act="tab" data-v="history" id="t-history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>History</button>
    <button data-act="tab" data-v="sessions" id="t-sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Sessions</button>
    <button data-act="tab" data-v="players" id="t-players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 14.5c2.7 0 5 2 5 5.5"/></svg>Players</button>
    <button data-act="tab" data-v="stats" id="t-stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20V14"/></svg>Stats</button>
    <button data-act="tab" data-v="me" id="t-me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.6-4 3.6-6.2 7.5-6.2s6.9 2.2 7.5 6.2"/></svg>Me</button>
  </div>
</nav>

<script>
(function(){
'use strict';

var CONFIG={apiKey:"AIzaSyBDvfwzsRpsc4WALuL14i2SiuQMJXEhlDo",authDomain:"smashx-pro2026.firebaseapp.com",projectId:"smashx-pro2026",storageBucket:"",messagingSenderId:"726099778079",appId:""};

var S={players:[{id:'p1',name:'Dani'},{id:'p2',name:'Naveen'},{id:'p3',name:'Nikhil'},{id:'p4',name:'Kiran'}],matches:[],sessions:[]};
var cloud={api:null,user:null};
var ui={tab:'matches',view:'list',mid:null,sid:null,err:'',sessionMode:'list',auth:'out'};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function viewPlayers(){
  var h='<h2>Players Roster</h2><div class="stack">'+
    '<div class="card row" style="flex-wrap:nowrap">'+
    '<input type="text" id="new-player-name" placeholder="Add a friend..." maxlength="24">'+
    '<button class="btn primary sm" data-act="addplayer">Add</button>'+
    '</div>';
  
  if(!S.players.length){
    h+='<div class="card empty"><b>No players added</b><p class="muted">Add player names above to start setting up games.</p></div>';
  } else {
    h+='<div class="card stack">';
    S.players.forEach(function(p){
      h+='<div class="player-row"><span><b>'+esc(p.name)+'</b></span><button class="btn sm danger" data-act="delplayer" data-id="'+p.id+'">Remove</button></div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}

function viewSessions(){
  if(ui.sessionMode==='create'){
    var playerBoxes=S.players.map(function(p){
      return '<label class="row" style="padding:4px 0"><input type="checkbox" class="sess-p" value="'+p.id+'" checked> <span>'+esc(p.name)+'</span></label>';
    }).join('');

    return '<div class="row sp"><h2>New Session</h2><button class="btn sm" data-act="cancelsession">Cancel</button></div>'+
      '<div class="card stack">'+
      '<div class="field"><label>Session Title</label><input type="text" id="s-title" placeholder="e.g. Wednesday Badminton Club"></div>'+
      '<div class="field"><label>Format</label><select id="s-type"><option value="doubles">Doubles</option><option value="singles">Singles</option></select></div>'+
      '<div class="field"><label>Select Participating Players</label><div class="card stack" style="max-height:160px;overflow-y:auto;background:var(--surface2)">'+(playerBoxes||'<p class="small muted">No players found. Add players first in the Players tab.</p>')+'</div></div>'+
      '<div class="grid2">'+
      '<div class="field"><label>Date</label><input type="date" id="s-date"></div>'+
      '<div class="field"><label>Time</label><input type="time" id="s-time"></div>'+
      '</div>'+
      '<button class="btn primary block" data-act="savesession">Save & Start Matches</button>'+
      (ui.err?'<p class="err-msg">'+esc(ui.err)+'</p>':'')+
      '</div>';
  }

  var h='<div class="row sp"><h2>Sessions</h2><button class="btn primary sm" data-act="newsession">Create session</button></div><div class="stack">';
  if(!S.sessions.length){
    h+='<div class="card empty"><b>No sessions yet</b><p class="muted">Tap Create session to group your matches.</p></div>';
  } else {
    S.sessions.forEach(function(sess){
      h+='<div class="card stack"><div><b>'+esc(sess.title)+'</b><div class="small muted">'+esc(sess.type.toUpperCase())+' · '+sess.playerIds.length+' players</div></div>'+
        '<div class="row"><button class="btn sm primary" data-act="tab" data-v="matches">View Matches</button><button class="btn sm danger" data-act="delsession" data-id="'+sess.id+'">Delete</button></div></div>';
    });
  }
  return h+'</div>';
}

function viewMatches(){
  var h='<h2>Active Matches</h2><div class="stack">';
  if(!S.matches.length){
    h+='<div class="card empty"><b>No active matches</b><p class="muted">Create a Session to automatically generate matches.</p></div>';
  } else {
    S.sessions.forEach(function(sess){
      var sessMatches=S.matches.filter(function(m){return m.sessId===sess.id;});
      if(sessMatches.length){
        h+='<h3>'+esc(sess.title)+'</h3>';
        sessMatches.forEach(function(m){
          h+='<div class="card mcard"><div><b>Match #'+m.id+'</b></div><div class="sc">'+m.scoreA+' - '+m.scoreB+'</div></div>';
        });
      }
    });
  }
  return h+'</div>';
}

function viewAuth(){
  return '<div class="card empty" style="margin-top:20px">'+
    '<b>Keep score. Know your game.</b>'+
    '<p class="muted">Sign in with Google to sync sessions and stats.</p>'+
    '<div style="margin-top:16px;width:100%"><button class="btn primary block" data-act="signin">Sign in with Google</button></div>'+
    (ui.err?'<p class="err-msg" style="margin-top:12px">'+esc(ui.err)+'</p>':'')+
    '</div>';
}

function render(){
  var v=document.getElementById('view');if(!v)return;
  var nav=document.getElementById('main-nav');
  if(ui.auth!=='in'){
    nav.hidden=true;
    v.innerHTML=viewAuth();
    return;
  }
  nav.hidden=false;
  var h='';
  if(ui.tab==='sessions') h=viewSessions();
  else if(ui.tab==='matches') h=viewMatches();
  else if(ui.tab==='history') h='<h2>History</h2><div class="card empty"><b>Completed Matches</b><p class="muted">Ended matches will move here.</p></div>';
  else if(ui.tab==='players') h=viewPlayers();
  else if(ui.tab==='stats') h='<h2>Stats</h2><div class="card empty"><b>Player Statistics</b><p class="muted">Metrics stay permanent even if match logs are deleted.</p></div>';
  else if(ui.tab==='me') h='<h2>My Account</h2><div class="card stack"><p class="small muted">Signed in as <b>'+esc(cloud.user?cloud.user.name:'Player')+'</b></p><button class="btn sm" data-act="signout">Sign out</button></div>';
  
  v.innerHTML=h;
  ['matches','history','sessions','players','stats','me'].forEach(function(t){
    var b=document.getElementById('t-'+t);
    if(b) b.classList.toggle('on',ui.tab===t);
  });
}

function go(tab){
  ui.tab=tab;
  ui.sessionMode='list';
  ui.err='';
  render();
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act, id=b.dataset.id;
  if(a==='tab') go(b.dataset.v);
  else if(a==='addplayer'){
    var inp=document.getElementById('new-player-name');
    var val=inp?(inp.value||'').trim():'';
    if(val){
      S.players.push({id:'p_'+Date.now(),name:val});
      render();
    }
  }
  else if(a==='delplayer'){
    S.players=S.players.filter(function(x){return x.id!==id;});
    render();
  }
  else if(a==='newsession'){ ui.sessionMode='create'; ui.err=''; render(); }
  else if(a==='cancelsession'){ ui.sessionMode='list'; ui.err=''; render(); }
  else if(a==='savesession'){
    var title=(document.getElementById('s-title').value||'').trim();
    var type=document.getElementById('s-type').value;
    var checked=[].slice.call(document.querySelectorAll('.sess-p:checked')).map(function(c){return c.value;});
    if(!title){ ui.err='Please enter a session title.'; render(); return; }
    if(checked.length<2){ ui.err='Select at least 2 players for a session.'; render(); return; }
    
    var sid='sess_'+Date.now();
    S.sessions.push({id:sid,title:title,type:type,playerIds:checked});
    S.matches.push({id:'m1',sessId:sid,scoreA:0,scoreB:0,status:'live'});
    
    ui.sessionMode='list';
    ui.tab='matches';
    ui.err='';
    render();
  }
  else if(a==='delsession'){
    S.sessions=S.sessions.filter(function(x){return x.id!==id;});
    S.matches=S.matches.filter(function(m){return m.sessId!==id;});
    render();
  }
  else if(a==='signin' && cloud.api) cloud.api.signIn();
  else if(a==='signout' && cloud.api) cloud.api.signOut();
});

async function bootCloud(){
  try {
    var B='https://www.gstatic.com/firebasejs/10.14.1/';
    var mods=await Promise.all([
      import(B+'firebase-app.js'),
      import(B+'firebase-auth.js')
    ]);
    var app=mods[0].initializeApp(CONFIG);
    var auth=mods[1].getAuth(app);
    
    cloud.api={
      signIn:function(){ var p=new mods[1].GoogleAuthProvider(); return mods[1].signInWithPopup(auth,p); },
      signOut:function(){ return mods[1].signOut(auth); }
    };
    
    mods[1].onAuthStateChanged(auth,function(u){
      if(u){ cloud.user={uid:u.uid,name:u.displayName||'Player'}; ui.auth='in'; }
      else { cloud.user=null; ui.auth='out'; }
      render();
    });
  } catch(e) {
    ui.auth='out';
    render();
  }
}

render();
bootCloud();
})();
</script>
</body>
</html>
