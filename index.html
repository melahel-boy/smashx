<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmashX</title>
<meta name="theme-color" content="#031021">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBF1EE; --surface:#FFFFFF; --surface2:#E1EAE5; --ink:#11231C; --muted:#586C63; --line:#C9D7D0;
  --accent:#0D7556; --accent-ink:#FFFFFF; --bad:#B8362A; --hi:#F2CF3D; --hi-ink:#2B2400;
  --ta:#2859D1; --ta-soft:#DDE6FA; --tb:#C9691A; --tb-soft:#F9E5D0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1714; --surface:#15231E; --surface2:#1E3029; --ink:#E8F1EC; --muted:#93A9A0; --line:#2A4036;
    --accent:#35C79A; --accent-ink:#06241B; --bad:#FF8577; --hi:#F2CF3D; --hi-ink:#2B2400;
    --ta:#8AA7FF; --ta-soft:#1B2A52; --tb:#F2A65E; --tb-soft:#46300F; color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font:500 16px/1.4 var(--body);
  padding-block:0 92px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.hero{width:100%;height:auto;display:block;border-radius:12px;margin:0 0 14px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px}
.brand{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;flex:none}
.sync{font-size:12px;color:var(--muted);text-align:right;min-width:0}
h2{font:700 24px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:18px 0 10px}
h3{font:700 14px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:48px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
select,input[type=text]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:700;line-height:1.5;white-space:nowrap}
.chip.srv{background:var(--accent);color:var(--accent-ink)}
.chip.hi{background:var(--hi);color:var(--hi-ink)}
.err-msg{color:var(--bad);font-weight:600;font-size:14px}
.empty{text-align:center;padding:26px 16px}
.empty b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}
.mcard{display:grid;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mcard .tn{font-weight:600;display:flex;justify-content:space-between;gap:8px;min-width:0}
.mcard .tn.win{font-weight:800}
.mcard .sc{font:700 20px/1 var(--display);letter-spacing:.04em}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:14px;padding:8px 12px 10px;min-width:0}
.side.a,.team.a{--tc:var(--ta)}
.side.b,.team.b{--tc:var(--tb)}
.side .lbl{font-size:13px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font:800 96px/.95 var(--display);color:var(--tc)}
.team{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:14px;padding:4px 12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0}
.prow+.prow{border-top:1px solid var(--line)}
.pname{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn{min-width:76px;min-height:54px;border-radius:12px;font-weight:800;font-size:15px;border:2px solid transparent;background:transparent}
.pbtn.win{background:var(--accent);color:var(--accent-ink)}
.pbtn.err{color:var(--bad);border-color:var(--bad)}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.mg div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.mg b{display:block;font:700 28px/1.05 var(--display)}
.mg span{font-size:12px;color:var(--muted);font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav div{max-width:560px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent);background:var(--surface2)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <div class="brand">
      <img src="logo-mark.png" alt="SmashX" width="34" height="34" style="border-radius:8px;flex:none;object-fit:cover" onerror="this.style.display='none'">
      SmashX
    </div>
    <div class="sync" id="sync"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="Main" id="main-nav" hidden>
  <div>
    <button data-act="tab" data-v="matches" id="t-matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M3 12h18"/></svg>Matches</button>
    <button data-act="tab" data-v="history" id="t-history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>History</button>
    <button data-act="tab" data-v="sessions" id="t-sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Sessions</button>
    <button data-act="tab" data-v="players" id="t-players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 14.5c2.7 0 5 2 5 5.5"/></svg>Players</button>
    <button data-act="tab" data-v="stats" id="t-stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20V14"/></svg>Stats</button>
    <button data-act="tab" data-v="me" id="t-me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.6-4 3.6-6.2 7.5-6.2s6.9 2.2 7.5 6.2"/></svg>Me</button>
  </div>
</nav>

<script>
(function(){
'use strict';

var CONFIG={apiKey:"AIzaSyBDvfwzsRpsc4WALuL14i2SiuQMJXEhlDo",authDomain:"smashx-pro2026.firebaseapp.com",projectId:"smashx-pro2026",storageBucket:"",messagingSenderId:"726099778079",appId:""};

var S={players:[],matches:[],sessions:[]};
var cloud={api:null,user:null,pending:false,fromCache:true};
var ui={tab:'matches',view:'list',mid:null,pid:null,sid:null,shot:'',err:'',form:{},sessionForm:{},auth:'out'};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function meId(){return cloud.user?cloud.user.uid:'';}

function viewAuth(){
  return '<div class="card empty" style="margin-top:20px">'+
    '<img class="hero" src="logo.jpg" alt="SmashX" width="800" height="436" onerror="this.style.display=\'none\'">'+
    '<b>Keep score. Know your game.</b>'+
    '<p class="muted">Sign in with Google. Every match is backed up and your stats follow you.</p>'+
    '<div style="margin-top:16px;width:100%"><button class="btn primary block" data-act="signin">Sign in with Google</button></div>'+
    (ui.err?'<p class="err-msg" style="margin-top:12px">'+esc(ui.err)+'</p>':'')+
    '</div>';
}

function viewList(){
  return '<h2>Matches</h2><div class="stack">'+
    '<div class="card empty"><b>No active matches</b><p class="muted">Create a session or start a new match from Sessions.</p></div>'+
    '</div>';
}

function viewSessions(){
  return '<div class="row sp"><h2>Sessions</h2><button class="btn primary sm" data-act="newsession">Create session</button></div>'+
    '<div class="card empty"><b>No sessions yet</b><p class="muted">Tap Create session to organize games.</p></div>';
}

function viewHistory(){
  return '<h2>Match History</h2><div class="stack">'+
    '<div class="card empty"><b>No completed matches</b><p class="muted">Finished matches will appear here.</p></div>'+
    '</div>';
}

function viewPlayers(){
  return '<h2>Players</h2><div class="stack">'+
    '<div class="card empty"><b>Players</b><p class="muted">Add players during match creation.</p></div>'+
    '</div>';
}

function viewStats(){
  return '<h2>Player Stats</h2><div class="stack">'+
    '<div class="card empty"><b>No Stats Available</b><p class="muted">Complete matches to view win/loss records.</p></div>'+
    '</div>';
}

function viewMe(){
  return '<h2>My Profile</h2><div class="card stack">'+
    '<p class="small muted">Signed in as <b>'+esc(cloud.user?cloud.user.name:'Player')+'</b></p>'+
    '<button class="btn sm" data-act="signout">Sign out</button>'+
    '</div>';
}

function render(){
  var v=document.getElementById('view');if(!v)return;
  var nav=document.getElementById('main-nav');
  if(ui.auth!=='in'){
    nav.hidden=true;
    v.innerHTML=viewAuth();
    return;
  }
  nav.hidden=false;
  var h='';
  if(ui.tab==='matches') h=viewList();
  else if(ui.tab==='history') h=viewHistory();
  else if(ui.tab==='sessions') h=viewSessions();
  else if(ui.tab==='players') h=viewPlayers();
  else if(ui.tab==='stats') h=viewStats();
  else if(ui.tab==='me') h=viewMe();
  v.innerHTML=h;
  
  ['matches','history','sessions','players','stats','me'].forEach(function(t){
    var b=document.getElementById('t-'+t);
    if(b){b.classList.toggle('on',ui.tab===t);}
  });
}

function go(tab){
  ui.tab=tab;
  ui.err='';
  render();
  window.scrollTo(0,0);
}

async function bootCloud(){
  try {
    var B='https://www.gstatic.com/firebasejs/10.14.1/';
    var mods=await Promise.all([
      import(B+'firebase-app.js'),
      import(B+'firebase-auth.js'),
      import(B+'firebase-firestore.js')
    ]);
    var app=mods[0].initializeApp(CONFIG);
    var auth=mods[1].getAuth(app);
    var db=mods[2].getFirestore(app);
    
    cloud.api={
      signIn:function(){
        var p=new mods[1].GoogleAuthProvider();
        p.setCustomParameters({prompt:'select_account'});
        return mods[1].signInWithPopup(auth,p);
      },
      signOut:function(){return mods[1].signOut(auth);}
    };
    
    mods[1].onAuthStateChanged(auth,function(u){
      if(!u){
        cloud.user=null;
        ui.auth='out';
      } else {
        cloud.user={uid:u.uid,name:u.displayName||'Player'};
        ui.auth='in';
      }
      render();
    });
  } catch(e) {
    ui.auth='out';
    render();
  }
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='tab') go(b.dataset.v);
  else if(a==='signin') {
    if(cloud.api) cloud.api.signIn().catch(function(err){ui.err='Sign-in failed. Check pop-up settings.';render();});
  }
  else if(a==='signout') {
    if(cloud.api) cloud.api.signOut();
  }
});

render();
bootCloud();
})();
</script>
</body>
</html>
