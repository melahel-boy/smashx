name: Deploy SmashX to Firebase Hosting

on:
  push:
    branches:
      - main
      - feature/account-deletion-restore

permissions:
  contents: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMASHX_PRO2026 }}
          channelId: live
          projectId: smashx-pro2026
