name: Deploy SmashX to Firebase Hosting

on:
  push:
    branches:
      - main
      - feature/account-deletion-restore
    paths:
      - '**'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/726099778079/locations/global/workloadIdentityPools/smashx-github-pool/providers/github
          service_account: firebase-adminsdk-fbsvc@smashx-pro2026.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project smashx-pro2026
