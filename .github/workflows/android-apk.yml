name: Build SmashX Signed Testing APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smashx-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current SmashX branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Capacitor dependencies
        run: npm install

      - name: Prepare the original SmashX web files
        run: npm run copy:web

      - name: Generate Android project and branded icon
        run: |
          mkdir -p assets
          node -e "require('sharp')('icon-512.png').resize(1024,1024,{fit:'contain',background:{r:13,g:23,b:20,alpha:1}}).png().toFile('assets/icon-only.png')"
          npx cap add android
          npx capacitor-assets generate --android
          python3 - <<'PY'
          from pathlib import Path
          import re
          variables = Path("android/variables.gradle")
          text = variables.read_text()
          if "rgcfaIncludeGoogle" not in text:
              if "ext {" not in text:
                  raise SystemExit("Could not find ext block in android/variables.gradle")
              text = text.replace("ext {", "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
              variables.write_text(text)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest.read_text()
          start = manifest_text.find("<application")
          end = manifest_text.find(">", start)
          if start < 0 or end < 0:
              raise SystemExit("Android manifest has no application element")
          tag = manifest_text[start:end + 1]
          for key, value in (("android:label", "SmashX"), ("android:icon", "@mipmap/ic_launcher"), ("android:roundIcon", "@mipmap/ic_launcher_round")):
              pattern = re.compile(re.escape(key) + r'\s*=\s*"[^"]*"')
              if pattern.search(tag):
                  tag = pattern.sub(key + '="' + value + '"', tag, count=1)
              else:
                  tag = tag[:-1] + ' ' + key + '="' + value + '">'
          manifest.write_text(manifest_text[:start] + tag + manifest_text[end + 1:])
          icon = Path("android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          if not icon.exists():
              raise SystemExit("Branded launcher icon was not generated")
          print("Google native auth enabled; branded launcher icon verified.")
          PY
          cat > android/app/src/main/java/com/smashx/badmintonscorer/MainActivity.java <<'EOF'
          package com.smashx.badmintonscorer;

          import com.getcapacitor.BridgeActivity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
              }
          }
          EOF
          npx cap sync android
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/build.gradle')
          s = p.read_text()
          if 'com.google.gms:google-services:' not in s:
              s = s.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
          p.write_text(s)
          app = Path('android/app/build.gradle')
          a = app.read_text()
          if 'com.google.gms.google-services' not in a:
              a += "\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(a)
          PY

      - name: Set Android minimum SDK for Google Play
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/variables.gradle")
          s = p.read_text()
          for key, value in (("minSdkVersion", 24), ("compileSdkVersion", 36), ("targetSdkVersion", 36)):
              s, count = re.subn(rf'({key}\s*=\s*)\d+', rf'\g<1>{value}', s, count=1)
              if count != 1:
                  raise SystemExit(f"Could not find {key} in android/variables.gradle")
          p.write_text(s)
          app_gradle = Path("android/app/build.gradle")
          a = app_gradle.read_text()
          a, version_count = re.subn(r'(versionCode\s+)\d+', r'\g<1>9', a, count=1)
          if version_count != 1:
              raise SystemExit("Could not set Android versionCode to 9")
          a, name_count = re.subn(r'(versionName\s+)[\"\'][^\"\']+[\"\']', r'\g<1>"2.1"', a, count=1)
          if name_count != 1:
              raise SystemExit("Could not set Android versionName to 2.1")
          app_gradle.write_text(a)
          print("Configured minSdkVersion=24, compileSdkVersion=36, targetSdkVersion=36, versionCode=9, versionName=2.1")
          PY

      - name: Upgrade Android Gradle tooling for API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          build = Path("android/build.gradle")
          s = build.read_text()
          s, count = re.subn(r"com\.android\.tools\.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.9.1", s, count=1)
          if count != 1:
              raise SystemExit("Could not update Android Gradle Plugin version")
          build.write_text(s)
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          w = wrapper.read_text()
          w, count = re.subn(r"gradle-[0-9.]+-(?:all|bin)\.zip", "gradle-8.11.1-all.zip", w, count=1)
          if count != 1:
              raise SystemExit("Could not update Gradle wrapper version")
          wrapper.write_text(w)
          print("Configured Android Gradle Plugin 8.9.1 and Gradle 8.11.1")
          PY

      - name: Restore existing SmashX upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 secret is missing" && exit 1)
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/smashx-upload-key.jks
          test -s android/app/smashx-upload-key.jks
          keytool -list -keystore android/app/smashx-upload-key.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" >/dev/null
          echo "Existing upload keystore restored and alias verified."

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("smashx-upload-key.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature and version
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$BUILD_TOOLS" || (echo "Android build-tools directory was not found under $SDK_ROOT" && exit 1)
          test -x "$BUILD_TOOLS/apksigner" || (echo "apksigner is missing from $BUILD_TOOLS" && exit 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee /tmp/apk-cert.txt
          grep -qi "88:1e:c1:63:0b:0c:90:06:37:d6:2d:2f:46:46:7f:ce:ec:49:c1:fc" /tmp/apk-cert.txt
          echo "Verified APK is signed with the existing SmashX upload certificate."
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package:|application-label:"

      - name: Upload signed testing APK
        uses: actions/upload-artifact@v4
        with:
          name: SmashX-Android-Signed-Testing-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

