name: Build SmashX Android APK and Play Store AAB

on:
  push:
    branches:
      - feature/account-deletion-restore
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - 'logo*'
      - 'google-services.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: smashx-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current SmashX branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android web app and branded icon
        run: |
          mkdir -p www assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png logo-mark.png logo.jpg www/
          test -f google-services.json || (echo 'Missing google-services.json in repository root' && exit 1)
          npm init -y
          npm install --save-exact @capacitor/core@6.2.1
          npm install --save-dev --save-exact @capacitor/cli@6.2.1
          npm install --save-exact @capacitor/android@6.2.1
          npm install --save-dev --save-exact @capacitor/assets@3.0.5 sharp
          npm install --save-exact @capacitor-firebase/authentication@6.3.1 @capacitor/status-bar@6.0.2
          node -e "require('sharp')('icon-512.png').resize(1024,1024,{fit:'contain',background:{r:13,g:23,b:20,alpha:1}}).png().toFile('assets/icon-only.png')"
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.smashx.badmintonscorer",
            "appName": "SmashX",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "FirebaseAuthentication": {
                "providers": ["google.com"],
                "skipNativeAuth": true
              }
            }
          }
          EOF
          npx cap add android
          npx capacitor-assets generate --android
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          variables = Path("android/variables.gradle")
          text = variables.read_text()
          if "rgcfaIncludeGoogle" not in text:
              if "ext {" not in text:
                  raise SystemExit("Could not find ext block in android/variables.gradle")
              text = text.replace("ext {", "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
              variables.write_text(text)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("Android manifest has no application element")
          app.set(ns + "label", "SmashX")
          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          icon = Path("android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          if not icon.exists():
              raise SystemExit("Branded launcher icon was not generated")
          print("Google native auth enabled; branded launcher icon verified.")
          PY
          npx cap sync android
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/build.gradle')
          s = p.read_text()
          if 'com.google.gms:google-services:' not in s:
              s = s.replace('dependencies {', 'dependencies {\n        classpath \'com.google.gms:google-services:4.4.2\'', 1)
          p.write_text(s)
          app = Path('android/app/build.gradle')
          a = app.read_text()
          if 'com.google.gms.google-services' not in a:
              a += '\napply plugin: \'com.google.gms.google-services\'\n'
          app.write_text(a)
          PY

      - name: Set Android minimum SDK for Google Play
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/variables.gradle")
          s = p.read_text()
          for key, value in (("minSdkVersion", 24), ("compileSdkVersion", 36), ("targetSdkVersion", 36)):
              s, count = re.subn(rf'({key}\s*=\s*)\d+', rf'\g<1>{value}', s, count=1)
              if count != 1:
                  raise SystemExit(f"Could not find {key} in android/variables.gradle")
          p.write_text(s)
          app_gradle = Path("android/app/build.gradle")
          a = app_gradle.read_text()
          a, version_count = re.subn(r'(versionCode\s+)\d+', r'\g<1>5', a, count=1)
          if version_count != 1:
              raise SystemExit("Could not set Android versionCode to 5")
          a, name_count = re.subn(r'(versionName\s+)[\"\'][^\"\']+[\"\']', r'\g<1>\"1.0.5\"', a, count=1)
          if name_count != 1:
              raise SystemExit("Could not set Android versionName to 1.0.5")
          app_gradle.write_text(a)
          print("Configured minSdkVersion=24, compileSdkVersion=36, targetSdkVersion=36, versionCode=5, versionName=1.0.5")
          PY

      - name: Upgrade Android Gradle tooling for API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          build = Path("android/build.gradle")
          s = build.read_text()
          s, count = re.subn(r"com\.android\.tools\.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.9.1", s, count=1)
          if count != 1:
              raise SystemExit("Could not update Android Gradle Plugin version")
          build.write_text(s)
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          w = wrapper.read_text()
          w, count = re.subn(r"gradle-[0-9.]+-(?:all|bin)\.zip", "gradle-8.11.1-all.zip", w, count=1)
          if count != 1:
              raise SystemExit("Could not update Gradle wrapper version")
          wrapper.write_text(w)
          print("Configured Android Gradle Plugin 8.9.1 and Gradle 8.11.1")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: SmashX-Android-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure Play upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing GitHub Actions secret: ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing GitHub Actions secret: ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing GitHub Actions secret: ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing GitHub Actions secret: ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/smashx-upload-key.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("smashx-upload-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in s:
              s = s.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          s = s.replace("    buildTypes {\n        release {", "    buildTypes {\n        release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY

      - name: Build signed Play Store App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: SmashX-Play-Store-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
