name: Build SmashX Android Testing APK

on:
  push:
    branches:
      - feature/account-deletion-restore
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - 'logo*'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current SmashX branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android web app
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png logo-mark.png logo.jpg www/
          npm init -y
          npm install --save-exact @capacitor/core@6.2.1
          npm install --save-dev --save-exact @capacitor/cli@6.2.1
          npm install --save-exact @capacitor/android@6.2.1
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.smashx.app",
            "appName": "SmashX",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: SmashX-Android-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
