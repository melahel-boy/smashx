<style>
/* Layout: one-column phone app. Header, one working view at a time, fixed bottom tabs.
   Scoreboard in two team colors on a court-green ground; shuttle-yellow marks game point. */
:root{
  --bg:#EBF1EE; --surface:#FFFFFF; --surface2:#E1EAE5; --ink:#11231C; --muted:#586C63; --line:#C9D7D0;
  --accent:#0D7556; --accent-ink:#FFFFFF; --bad:#B8362A; --hi:#F2CF3D; --hi-ink:#2B2400;
  --ta:#2859D1; --ta-soft:#DDE6FA; --tb:#C9691A; --tb-soft:#F9E5D0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1714; --surface:#15231E; --surface2:#1E3029; --ink:#E8F1EC; --muted:#93A9A0; --line:#2A4036;
    --accent:#35C79A; --accent-ink:#06241B; --bad:#FF8577; --hi:#F2CF3D; --hi-ink:#2B2400;
    --ta:#8AA7FF; --ta-soft:#1B2A52; --tb:#F2A65E; --tb-soft:#46300F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1714; --surface:#15231E; --surface2:#1E3029; --ink:#E8F1EC; --muted:#93A9A0; --line:#2A4036;
  --accent:#35C79A; --accent-ink:#06241B; --bad:#FF8577; --hi:#F2CF3D; --hi-ink:#2B2400;
  --ta:#8AA7FF; --ta-soft:#1B2A52; --tb:#F2A65E; --tb-soft:#46300F; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font:500 16px/1.4 var(--body);
  padding-block:0 92px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.hero{width:100%;height:auto;display:block;border-radius:12px;margin:0 0 14px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px}
.brand{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;flex:none}
.brand svg{width:24px;height:24px;color:var(--accent);flex:none}
.sync{font-size:12px;color:var(--muted);text-align:right;min-width:0}
h2{font:700 24px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:18px 0 10px;text-wrap:balance}
h3{font:700 14px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:48px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
select,input[type=text],textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
textarea{padding:10px 12px;min-height:90px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:700;line-height:1.5;white-space:nowrap}
.chip.srv{background:var(--accent);color:var(--accent-ink)}
.chip.hi{background:var(--hi);color:var(--hi-ink)}
.chip.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.chip.W{background:var(--accent);color:var(--accent-ink)}
.chip.L{background:var(--surface2);color:var(--muted)}
.err-msg{color:var(--bad);font-weight:600;font-size:14px}
.empty{text-align:center;padding:26px 16px}
.empty b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}

/* Match list */
.mcard{display:grid;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mcard .tn{font-weight:600;display:flex;justify-content:space-between;gap:8px;min-width:0}
.mcard .tn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .tn.win{font-weight:800}
.mcard .sc{font:700 20px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.live{border-color:var(--accent);box-shadow:inset 6px 0 0 var(--accent)}

/* Scoring */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:14px;padding:8px 12px 10px;min-width:0}
.side.a,.team.a{--tc:var(--ta)}
.side.b,.team.b{--tc:var(--tb)}
.side .lbl{font-size:13px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font:800 96px/.95 var(--display);color:var(--tc);font-variant-numeric:tabular-nums}
.side .st{min-height:24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:10px 2px}
.team{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:14px;padding:4px 12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:8px 0}
.prow+.prow{border-top:1px solid var(--line)}
.pname{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:12.5px;color:var(--muted)}
.pbtn{min-width:76px;min-height:54px;border-radius:12px;font-weight:800;font-size:15px;border:2px solid transparent;background:transparent}
.pbtn.win{background:var(--accent);color:var(--accent-ink)}
.pbtn.err{color:var(--bad);border-color:var(--bad)}
.pbtn:active{transform:scale(.96)}
.shots{display:flex;gap:6px;flex-wrap:wrap}
.sc-btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;min-height:38px;font-weight:700;font-size:14px}
.sc-btn.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:0}
.log li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .s{font:700 17px/1.2 var(--display);letter-spacing:.04em;min-width:58px;font-variant-numeric:tabular-nums}
.log .ta{color:var(--ta)} .log .tb{color:var(--tb)}

/* Stats */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.pcard .mg{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pcard .mg div{padding:8px}
.nw{white-space:nowrap}
.mg div{background:var(--surface2);border-radius:10px;padding:8px 10px;min-width:0}
.mg b{display:block;font:700 28px/1.05 var(--display);font-variant-numeric:tabular-nums}
.mg span{font-size:12px;color:var(--muted);font-weight:600}
.pcard{display:grid;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pcard .nm{font-weight:800;font-size:18px;display:flex;justify-content:space-between;gap:8px}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.brow{display:grid;grid-template-columns:78px 1fr 34px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);font-size:14px}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:700}
.tbl th{font-size:12px;color:var(--muted);border-top:0}
.scroll-x{overflow-x:auto}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
summary{font-weight:700;cursor:pointer;min-height:28px}

/* Bottom tabs */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav div{max-width:560px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent);background:var(--surface2)}
@media (prefers-reduced-motion:reduce){.btn:active,.pbtn:active{transform:none}}
@media (max-width:380px){.num{font-size:80px}.pbtn{min-width:68px}}

/* Batch 1 additions */
.searchbox{margin-bottom:10px}.statusline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.triple{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.note{font-size:12px;color:var(--muted)}.pid{font:700 13px/1 var(--display);letter-spacing:.08em;color:var(--muted)}

<script>
(function(){
'use strict';
/*CORE*/
var SHOTS=[['s','Smash'],['d','Drop'],['n','Net'],['v','Drive'],['l','Lob'],['x','Serve']];
var SHOT={};SHOTS.forEach(function(x){SHOT[x[0]]=x[1];});
var CAP={21:30,15:21,11:15};
function capFor(tg){return CAP[tg]||(+tg+9);}
function matchSize(m){return m&&m.sz===1?1:2;}
function matchStatus(m){if(m&&m.st)return m.st;return matchState(m).done?'completed':'inprogress';}
function uid(){return Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6);}
function isOver(a,b,tg){var mx=Math.max(a,b);return (mx>=tg&&Math.abs(a-b)>=2)||mx>=capFor(tg);}
function parseR(s){var a=String(s).split(':');return{t:+a[0],p:a[1],k:a[2],s:a[3]||'',ts:a[4]?+a[4]:0};}
/* pos = [A right, A left, B right, B left]. Index 0 of a team is the right court. */
function gameState(g,tg){
  var singles=g.pos.length===2,P=singles?[[g.pos[0]],[g.pos[1]]]:[[g.pos[0],g.pos[1]],[g.pos[2],g.pos[3]]];
  var s=[0,0],srv=g.f,over=false,winner=-1,n=0;
  for(var i=0;i<g.r.length;i++){if(over)break;var r=parseR(g.r[i]);s[r.t]++;n++;if(!singles&&r.t===srv){P[r.t]=[P[r.t][1],P[r.t][0]];}else if(r.t!==srv){srv=r.t;}if(isOver(s[0],s[1],tg)){over=true;winner=s[0]>s[1]?0:1;}}
  var server=singles?P[srv][0]:P[srv][s[srv]%2===0?0:1];
  return{s:s,srv:srv,server:server,P:P,over:over,winner:winner,n:n};
}
function wouldWin(st,t,tg){var s=st.s.slice();s[t]++;return isOver(s[0],s[1],tg);}
function matchState(m){
  var need=Math.floor(m.bo/2)+1,w=[0,0],games=[];
  m.g.forEach(function(g){var st=gameState(g,m.tg);games.push(st);if(st.over)w[st.winner]++;});
  var even=(m.fx&&m.bo%2===0),winner=even?-1:(w[0]>=need?0:(w[1]>=need?1:-1));
  var cur=games[games.length-1];
  var closed=m.st==='cancelled'||m.st==='ended';return{games:games,w:w,need:need,winner:winner,done:winner>=0||closed||(even&&games.length>=m.bo&&games.every(function(x){return x.over;})),cur:cur};
}
function inc(o,k){o[k]=(o[k]||0)+1;}
function computeStats(matches){
  var P={},pairs={};
  function get(id){return P[id]||(P[id]={id:id,m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,f:0,tp:0,tl:0,sw:{},se:{},sf:{},form:[],partners:{}});}
  var list=matches.filter(function(m){return !m.del&&m.st!=='cancelled';}).sort(function(a,b){return a.t-b.t;});
  list.forEach(function(m){
    var ms=matchState(m),ids=m.tm;
    ids.forEach(get);
    function team(id){return matchSize(m)===1?(ids.indexOf(id)===0?0:1):(ids.indexOf(id)<2?0:1);}
    m.g.forEach(function(g,gi){
      g.r.forEach(function(raw){
        var r=parseR(raw);
        ids.forEach(function(id){if(team(id)===r.t)get(id).tp++;else get(id).tl++;});
        if(r.k==='w'){get(r.p).w++;inc(get(r.p).sw,r.s||'-');}
        else if(r.k==='e'){get(r.p).e++;inc(get(r.p).se,r.s||'-');}else if(r.k==='f'){get(r.p).f++;inc(get(r.p).sf,r.s||'-');}
      });
      var st=ms.games[gi];
      if(st.over)ids.forEach(function(id){if(team(id)===st.winner)get(id).gw++;else get(id).gl++;});
    });
    if(ms.done){
      ids.forEach(function(id){
        var p=get(id),won=team(id)===ms.winner;
        p.m++;if(won){p.mw++;}else{p.ml++;}
        p.form.push(won?'W':'L');
        if(matchSize(m)===2){var T=team(id),partner=ids[T*2]===id?ids[T*2+1]:ids[T*2];var pr=p.partners[partner]||(p.partners[partner]={w:0,l:0});if(won)pr.w++;else pr.l++;}
      });
      if(matchSize(m)===2)[0,1].forEach(function(T){
        var pr=[ids[T*2],ids[T*2+1]].sort(),key=pr.join('+');
        var o=pairs[key]||(pairs[key]={ids:pr,w:0,l:0});
        if(ms.winner===T)o.w++;else o.l++;
      });
    }
  });
  return{P:P,pairs:pairs};
}
function okMatch(m){
  if(!m||!m.id)return false;
  if(m.del)return true;
  return Array.isArray(m.tm)&&(m.tm.length===4||m.tm.length===2)&&Array.isArray(m.g)&&m.g.length>0&&typeof m.tg==='number'&&typeof m.bo==='number'&&
    m.g.every(function(g){return g&&Array.isArray(g.pos)&&(g.pos.length===4||g.pos.length===2)&&Array.isArray(g.r)&&(g.f===0||g.f===1);});
}
function clone(x){return JSON.parse(JSON.stringify(x));}
/* Merge records by id, newest `u` wins. Returns true when anything changed. */
function mergeInto(S,dirty,rp,rm,markDirty){
  var ch=false,i;
  var lp={};S.players.forEach(function(p){lp[p.id]=p;});
  (rp||[]).forEach(function(r){
    if(!r||!r.id||typeof r.name!=='string')return;
    var l=lp[r.id];
    if(!l){S.players.push(clone(r));ch=true;if(markDirty)dirty.p=true;}
    else if((r.u||0)>(l.u||0)){Object.assign(l,clone(r));ch=true;if(markDirty)dirty.p=true;}
  });
  var lm={};S.matches.forEach(function(m){lm[m.id]=m;});
  (rm||[]).forEach(function(r){
    if(!okMatch(r))return;
    var l=lm[r.id];
    if(!l){S.matches.push(clone(r));ch=true;if(markDirty)dirty.m.add(r.id);}
    else if((r.u||0)>(l.u||0)){i=S.matches.indexOf(l);S.matches[i]=clone(r);ch=true;if(markDirty)dirty.m.add(r.id);}
  });
  return ch;
}

function syncText(){
  if(!cloud.user)return '';
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return 'Offline';
  if(cloud.pending)return 'Saving';
  if(cloud.fromCache)return 'Connecting';

}
function updSync(){var el=document.getElementById('sync');if(el)el.textContent=syncText();}
function writeErr(e){ui.err=(e&&e.code==='permission-denied')?'You can only change things you created.':'Could not save. It will retry when you are online.';render();}
function touchP(p){p.u=Date.now();cloud.api.set('players',p.id,clean(p)).catch(writeErr);render();}
function touchM(m){m.u=Date.now();m.pids=m.tm.slice();cloud.api.set('matches',m.id,clean(m)).catch(writeErr);}
function stopWatch(){cloud.stops.forEach(function(f){try{f();}catch(e){}});cloud.stops=[];}
function startWatch(){
  stopWatch();
  cloud.stops.push(cloud.api.watch('players',function(docs,md){
    S.players=docs.filter(function(p){return p&&p.id&&typeof p.name==='string';});
    cloud.pending=md.hasPendingWrites;cloud.fromCache=md.fromCache;
    ensureMe();safeRender();updSync();

    S.matches=docs.filter(okMatch);
    cloud.pending=md.hasPendingWrites;cloud.fromCache=md.fromCache;
    safeRender();updSync();
  },function(){ui.err='Could not load matches.';}));

function ensureMe(){
  var u=cloud.user;if(!u||cloud.meTried||cloud.fromCache)return;
  if(S.players.some(function(p){return p.id===u.uid;})){cloud.meTried=true;return;}
  cloud.meTried=true;
  cloud.api.set('players',u.uid,{id:u.uid,name:u.name,uid:u.uid,by:u.uid,u:Date.now()}).catch(function(){cloud.meTried=false;});
}
function onUser(u){
  stopWatch();cloud.meTried=false;
  if(!u){cloud.user=null;S={players:[],matches:[]};ui.auth='out';ui.tab='matches';ui.view='list';render();return;}
  cloud.user={uid:u.uid,name:u.displayName||'Player',photo:u.photoURL||''};
  ui.auth='in';ui.err='';render();startWatch();
}
async function bootCloud(){
  if(window.__FAKE_CLOUD__){cloud.api=window.__FAKE_CLOUD__;}
  else{
    if(!CONFIG.apiKey){ui.auth='setup';render();return;}
    var B='https://www.gstatic.com/firebasejs/10.14.1/';
    var mods=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    var A=mods[0],Au=mods[1],F=mods[2];
    var app=A.initializeApp(CONFIG),auth=Au.getAuth(app),db;
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}
    catch(e){db=F.getFirestore(app);}
    cloud.api={
      onAuth:function(cb){return Au.onAuthStateChanged(auth,cb);},
      signIn:function(){var p=new Au.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return Au.signInWithPopup(auth,p);},
      signOut:function(){return Au.signOut(auth);},
      watch:function(col,next,err){return F.onSnapshot(F.collection(db,col),{includeMetadataChanges:true},function(snap){next(snap.docs.map(function(d){return d.data();}),snap.metadata);},err);},
      set:function(col,id,data){return F.setDoc(F.doc(db,col,id),data);},
      update:function(col,id,data){return F.updateDoc(F.doc(db,col,id),data);}
    };
  }
  cloud.api.onAuth(onUser);
}
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);}
function safeRender(){var a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render();}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function players(){return S.players.filter(function(p){return !p.del;});}
function liveMatches(){return S.matches.filter(function(m){return !m.del;});}
function nameOf(id){var p=S.players.find(function(x){return x.id===id;});return p?p.name:'Player';}
function teamIds(m,T){return matchSize(m)===1?[m.tm[T]]:[m.tm[T*2],m.tm[T*2+1]];}
function teamName(m,T){return teamIds(m,T).map(nameOf).join(' & ');}
function curMatch(){return S.matches.find(function(m){return m.id===ui.mid&&!m.del;});}
function fmtDate(t){try{return new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});}catch(e){return '';}}
function pct(a,b){return b?Math.round(a*100/b)+'%':'–';}
function signed(n){return (n>0?'+':'')+n;}
function scoreLine(ms){return ms.games.filter(function(g){return g.n>0;}).map(function(g){return g.s[0]+'–'+g.s[1];}).join('  ·  ');}
function courtOf(st,T,id){return st.P[T].indexOf(id)===0?'Right court':'Left court';}
function hasExamples(){return false;}
function meId(){return cloud.user?cloud.user.uid:'';}
function gameStatsFor(g){var o={};g.r.forEach(function(raw){var r=parseR(raw);var x=o[r.p]||(o[r.p]={w:0,e:0,f:0});if(r.k==='w')x.w++;else if(r.k==='e')x.e++;else if(r.k==='f')x.f++;});return o;}
function rallyLines(m,g,st){
  var s=[0,0],out=[];
  g.r.forEach(function(raw,i){
    var r=parseR(raw);if(i>=st.n)return;
    s[r.t]++;
    var what=(r.k==='w'?'winner':'error')+(r.s?' · '+SHOT[r.s].toLowerCase():'');
    out.push({sc:s[0]+'–'+s[1],t:r.t,text:nameOf(r.p)+' '+what});
  });
  return out;
}
function keepAwake(){try{if(!window.__wl&&navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){window.__wl=l;l.addEventListener('release',function(){window.__wl=null;});}).catch(function(){});}}catch(e){}}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}}

/* ---------- views ---------- */
function emptyCard(title,text,btns){return '<div class="card empty"><b>'+title+'</b><p class="muted">'+text+'</p><div class="row" style="justify-content:center;margin-top:14px">'+btns+'</div></div>';}

function matchCard(m){
  var ms=matchState(m),done=ms.done;
  var line=ms.games.filter(function(g){return g.n>0;}).map(function(g){return g.s[0]+'–'+g.s[1];}).join(' · ');
  return '<button class="mcard'+(done?'':' live')+'" data-act="open" data-id="'+m.id+'">'+
    '<div class="row sp small muted"><span>'+esc(fmtDate(m.t))+' · to '+m.tg+' · best of '+m.bo+'</span><span>'+(m.ex?'<span class="chip ex">example</span> ':'')+(done?'':'<span class="chip srv">In progress</span>')+'</span></div>'+
    [0,1].map(function(T){return '<div class="tn'+(ms.winner===T?' win':'')+'"><span>'+esc(teamName(m,T))+'</span><span>'+(ms.winner===T?'Won ':'')+ms.w[T]+'</span></div>';}).join('')+
    '<div class="sc">'+(line||'0–0')+'</div></button>';
}

function viewList(){
  var ms=liveMatches().sort(function(a,b){return b.t-a.t;});
  var prog=ms.filter(function(m){return !matchState(m).done;});
  var done=ms.filter(function(m){return matchState(m).done;});
  var h='<h2>Matches</h2><div class="stack">';
  h+='<button class="btn primary block" data-act="new">New doubles match</button>';
  if(!ms.length){
    h+=emptyCard('Keep score. Know your game.','Add four players, then tap who wins each rally. Winners and errors are saved for every player.','<button class="btn" data-act="tab" data-v="players">Add players</button>');
  }
  if(prog.length){h+='<h3>In progress</h3>'+prog.map(matchCard).join('');}
  if(done.length){h+='<h3>Finished</h3>'+done.map(matchCard).join('');}
  if(hasExamples())h+='<button class="btn sm" data-act="rmsample">Remove sample data</button>';
  return h+'</div>';
}

function selOpts(sel){return '<option value="">Choose…</option>'+players().map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+'</option>';}).join('');}

function teamCard(m,ms,T,gs,over){
  var g=ms.cur,tg=m.tg,cls=T===0?'a':'b';
  var ids=teamIds(m,T);
  var rows=ids.map(function(id){
    var x=gs[id]||{w:0,e:0},isSrv=!over&&g.srv===T&&g.server===id;
    return '<div class="prow"><div style="min-width:0"><div class="row" style="gap:6px;flex-wrap:nowrap"><span class="pname">'+esc(nameOf(id))+'</span>'+(isSrv?'<span class="chip srv">Serving</span>':'')+'</div>'+
      '<div class="pmeta"><span class="nw">'+courtOf(g,T,id)+'</span> · <span class="nw">'+x.w+' won · '+x.e+' err</span></div></div>'+
      '<button class="pbtn win" data-act="pt" data-p="'+id+'" aria-label="Point won by '+esc(nameOf(id))+'"'+(over?' disabled':'')+'>Point</button>'+
      '<button class="pbtn err" data-act="er" data-p="'+id+'" aria-label="Error by '+esc(nameOf(id))+'"'+(over?' disabled':'')+'>Error</button><button class="pbtn err" data-act="fault" data-p="'+id+'" aria-label="Fault by '+esc(nameOf(id))+'"'+(over?' disabled':'')+'>Fault</button></div>';
  }).join('');
  return '<div class="team '+cls+'">'+rows+'</div>';
}

function viewScore(){
  var m=curMatch();
  if(!m){ui.view='list';return viewList();}
  if(m.by!==meId()){ui.view='detail';return viewDetail();}
  keepAwake();
  var ms=matchState(m),g=ms.cur,tg=m.tg,gi=m.g.length,over=g.over;
  var gs=gameStatsFor(m.g[gi-1]);
  var gp=[0,1].map(function(T){return !over&&wouldWin(g,T,tg);});
  var h='<div class="row sp"><button class="btn sm" data-act="back">← Matches</button><span class="small muted">'+(ms.done?'Match complete':'Game '+gi+' of '+m.bo)+'</span></div>';
  h+='<div class="board" style="margin-top:12px">'+[0,1].map(function(T){
    var chips='';
    if(!over&&g.srv===T)chips+='<span class="chip srv">Serving</span>';
    if(gp[T])chips+='<span class="chip hi">'+(ms.w[T]+1>=ms.need?'Match point':'Game point')+'</span>';
    return '<div class="side '+(T===0?'a':'b')+'"><div class="lbl">'+(T===0?'A':'B')+' · '+esc(teamName(m,T))+'</div><div class="num" aria-label="Score">'+g.s[T]+'</div><div class="st">'+chips+'</div></div>';
  }).join('')+'</div>';
  h+='<div class="gline"><span>First to '+tg+', win by 2 (cap '+capFor(tg)+')</span><span>Games '+ms.w[0]+'–'+ms.w[1]+'</span></div>';
  if(!over){
    h+='<div class="card" style="margin-bottom:12px"><div class="small muted" style="margin-bottom:6px">Shot (optional, applies to the next tap)</div><div class="shots">'+
      SHOTS.map(function(x){return '<button class="sc-btn'+(ui.shot===x[0]?' on':'')+'" data-act="shot" data-s="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div></div>';
  }
  h+='<div class="stack">'+teamCard(m,ms,0,gs,over)+teamCard(m,ms,1,gs,over)+'</div>';

  if(over&&!ms.done){
    var nx=ui.next;
    if(!nx||nx.mid!==m.id||nx.n!==gi){var lg=m.g[gi-1];nx=ui.next={mid:m.id,n:gi,f:g.winner,pos:lg.pos.slice()};}
    h+='<div class="card stack" style="margin-top:12px;border-color:var(--accent)"><div><b>Game '+gi+' to '+esc(teamName(m,g.winner))+'</b> <span class="muted">'+g.s[0]+'–'+g.s[1]+'</span></div>'+
      '<div class="field"><label>Serves first in game '+(gi+1)+'</label><div class="grid2"><button class="btn'+(nx.f===0?' primary':'')+'" data-act="nserve" data-t="0">Team A</button><button class="btn'+(nx.f===1?' primary':'')+'" data-act="nserve" data-t="1">Team B</button></div></div>'+
      '<div class="field"><label>Starting courts (right · left)</label><div class="grid2">'+
      [0,1].map(function(T){return '<button class="btn" data-act="nswap" data-t="'+T+'">'+esc(nameOf(nx.pos[T*2]))+' · '+esc(nameOf(nx.pos[T*2+1]))+' ⇄</button>';}).join('')+'</div></div>'+
      '<button class="btn primary block" data-act="startnext">Start game '+(gi+1)+'</button></div>';
  }
  if(ms.done){
    h+='<div class="card stack" style="margin-top:12px;border-color:var(--accent)"><div><b>'+esc(teamName(m,ms.winner))+' won the match</b> <span class="muted">'+ms.w[0]+'–'+ms.w[1]+'</span></div><button class="btn primary block" data-act="detail" data-id="'+m.id+'">See player stats</button></div>';
  }
  var canUndo=m.g.length>1||m.g[0].r.length>0;
  h+='<div class="row" style="margin:12px 0"><button class="btn" data-act="undo"'+(canUndo?'':' disabled')+'>↶ Undo last point</button></div>';
  var lines=rallyLines(m,m.g[gi-1],g).slice(-6).reverse();
  if(lines.length){
    h+='<h3>Last points</h3><div class="card"><ul class="log">'+lines.map(function(l){return '<li><span class="s '+(l.t===0?'ta':'tb')+'">'+l.sc+'</span><span>'+esc(l.text)+'</span></li>';}).join('')+'</ul></div>';
  }
  return h;
}

  h+='<h2>'+(ms.done?esc(teamName(m,ms.winner))+' won':'In progress')+'</h2>';
  h+='<div class="stack"><div class="card stack">'+[0,1].map(function(T){return '<div class="row sp"><b style="color:var(--'+(T?'tb':'ta')+')">'+esc(teamName(m,T))+'</b><span style="font:800 26px/1 var(--display)">'+ms.w[T]+'</span></div>';}).join('')+
    '<div class="small muted">'+(scoreLine(ms)||'No points yet')+'</div></div>';

  return h;

function metric(v,l){return '<div><b>'+v+'</b><span>'+l+'</span></div>';}
function viewStats(){
  var res=computeStats(liveMatches()),P=res.P;
  var pl=players().map(function(p){return Object.assign({name:p.name},P[p.id]||{id:p.id,m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,tp:0,tl:0,sw:{},se:{},form:[],partners:{}});});
  var any=pl.some(function(p){return p.w+p.e>0;});
  pl.sort(function(a,b){var ra=a.m?a.mw/a.m:-1,rb=b.m?b.mw/b.m:-1;return rb-ra||b.mw-a.mw||(b.w-b.e)-(a.w-a.e);});
  var h='<h2>Player stats</h2><div class="stack">';
  if(!any){h+=emptyCard('No points yet','Score a match and every winner and error is tallied per player.','<button class="btn primary" data-act="tab" data-v="matches">Go to matches</button>');return h+'</div>';}
  pl.forEach(function(p){
    h+='<button class="pcard" data-act="player" data-id="'+p.id+'"><div class="nm"><span>'+esc(p.name)+'</span><span class="muted small" style="font-weight:600">'+p.m+' match'+(p.m===1?'':'es')+'</span></div>'+
      '<div class="mg">'+metric(p.mw+'–'+p.ml,'Won–lost')+metric(p.w,'Winners')+metric(p.e,'Errors')+metric(signed(p.w-p.e),'Net')+'</div></button>';
  });
  var pairs=Object.keys(res.pairs).map(function(k){return res.pairs[k];}).sort(function(a,b){return (b.w-b.l)-(a.w-a.l)||b.w-a.w;});
  if(pairs.length){
    h+='<h3>Partnerships</h3><div class="card"><ul class="log">'+pairs.map(function(p){return '<li><span class="s">'+p.w+'–'+p.l+'</span><span>'+esc(nameOf(p.ids[0]))+' &amp; '+esc(nameOf(p.ids[1]))+'</span></li>';}).join('')+'</ul></div>';
  }
  h+='<p class="small muted">Winners are rallies a player finished. Errors are points a player gave away. Net is winners minus errors.</p>';
  return h+'</div>';
}
function viewPlayer(){return playerPage(computeStats(liveMatches()).P[ui.pid],nameOf(ui.pid),'<div class="row sp"><button class="btn sm" data-act="back">← Stats</button></div>');}
function myPids(){var me=meId();return players().filter(function(p){return p.uid===me;}).map(function(p){return p.id;});}
function sumStats(list){
  var o={m:0,mw:0,ml:0,gw:0,gl:0,w:0,e:0,tp:0,tl:0,sw:{},se:{},form:[],partners:{}};
  list.forEach(function(p){
    ['m','mw','ml','gw','gl','w','e','tp','tl'].forEach(function(k){o[k]+=p[k];});
    ['sw','se'].forEach(function(k){Object.keys(p[k]).forEach(function(x){o[k][x]=(o[k][x]||0)+p[k][x];});});
    Object.keys(p.partners).forEach(function(id){var q=o.partners[id]||(o.partners[id]={w:0,l:0});q.w+=p.partners[id].w;q.l+=p.partners[id].l;});
    o.form=o.form.concat(p.form);
  });
  return o;
}
function viewMe(){
  var P=computeStats(liveMatches()).P;
  var mine=myPids().map(function(id){return P[id];}).filter(Boolean);
  var top='<div class="row sp" style="margin-top:14px"><span class="small muted">Signed in as '+esc(cloud.user.name)+'. Includes every match under your account.</span></div>';
  return playerPage(mine.length?sumStats(mine):null,'My stats',top);
}
function viewAuth(){
  if(ui.auth==='loading')return '<div class="card empty" style="margin-top:20px"><b>Loading</b><p class="muted">Getting things ready.</p></div>';
  if(ui.auth==='setup')return '<div class="card empty" style="margin-top:20px"><b>Almost there</b><p class="muted">This app is not connected to its Google back office yet.</p></div>';
  return '<div class="card empty" style="margin-top:20px"><img class="hero" src="logo.jpg" alt="SmashX" width="800" height="436"><b>Keep score. Know your game.</b><p class="muted">Sign in with Google. Every match is backed up and your own stats follow you into every game.</p><div style="margin-top:16px;width:100%"><button class="btn primary block" data-act="signin">Sign in with Google</button></div>'+(ui.err?'<p class="err-msg" style="margin-top:12px">'+esc(ui.err)+'</p>':'')+'</div>';
}
function playerPage(p,title,top){
  var h=top+'<h2>'+esc(title)+'</h2>';
  if(!p)return h+'<div class="card"><p class="muted">No matches yet for this player.</p></div>';
  h+='<div class="stack"><div class="card stack"><div class="mg">'+metric(p.mw+'–'+p.ml,'Matches won–lost')+metric(p.gw+'–'+p.gl,'Games won–lost')+metric(pct(p.mw,p.m),'Match win rate')+
    metric(p.w,'Winners')+metric(p.e,'Errors')+metric(signed(p.w-p.e),'Net')+metric(pct(p.w,p.tp),'Share of team points')+'</div></div>';
  var maxW=Math.max.apply(null,Object.keys(p.sw).map(function(k){return p.sw[k];}).concat([1]));
  var keys=SHOTS.map(function(x){return x[0];}).concat(['-']);
  var hasShots=keys.some(function(k){return p.sw[k];});
  if(hasShots){
    h+='<h3>Winners by shot</h3><div class="card stack">'+keys.filter(function(k){return p.sw[k];}).map(function(k){var n=p.sw[k];return '<div class="brow"><span>'+(k==='-'?'Untagged':SHOT[k])+'</span><div class="bar"><span style="width:'+Math.round(n*100/maxW)+'%"></span></div><b>'+n+'</b></div>';}).join('')+'</div>';
  }
  var maxE=Math.max.apply(null,Object.keys(p.se).map(function(k){return p.se[k];}).concat([1]));
  if(keys.some(function(k){return p.se[k];})){
    h+='<h3>Errors by shot</h3><div class="card stack">'+keys.filter(function(k){return p.se[k];}).map(function(k){var n=p.se[k];return '<div class="brow"><span>'+(k==='-'?'Untagged':SHOT[k])+'</span><div class="bar"><span style="width:'+Math.round(n*100/maxE)+'%;background:var(--bad)"></span></div><b>'+n+'</b></div>';}).join('')+'</div>';
  }
  var pk=Object.keys(p.partners);
  if(pk.length){
    h+='<h3>With partners</h3><div class="card"><ul class="log">'+pk.map(function(id){var x=p.partners[id];return '<li><span class="s">'+x.w+'–'+x.l+'</span><span>with '+esc(nameOf(id))+'</span></li>';}).join('')+'</ul></div>';
  }
  if(p.form.length){
    h+='<h3>Recent matches</h3><div class="row">'+p.form.slice(-10).reverse().map(function(f){return '<span class="chip '+f+'">'+f+'</span>';}).join('')+'</div>';
  }
  return h+'</div>';
}

function render(){
  var v=document.getElementById('view');if(!v)return;
  var nav=document.querySelector('.nav');
  if(ui.auth!=='in'){nav.hidden=true;v.innerHTML=viewAuth();updSync();return;}
  nav.hidden=false;
  var h;
  if(ui.tab==='matches'){
    h=ui.view==='new'?viewNew():ui.view==='match'?viewScore():ui.view==='detail'?viewDetail():viewList();
  }else if(ui.tab==='me'){h=viewMe();}else if(ui.tab==='players'){h=viewPlayers();}
  else{h=ui.view==='player'?viewPlayer():viewStats();}
  v.innerHTML=h;
  ['matches','me','players','stats'].forEach(function(t){var b=document.getElementById('t-'+t);if(b){b.classList.toggle('on',ui.tab===t);b.setAttribute('aria-current',ui.tab===t?'page':'false');}});
  updSync();
}
function go(tab,view){ui.tab=tab;ui.view=view||(tab==='matches'?'list':tab==='stats'?'stats':'');ui.err='';ui.confirm=null;ui.edit=null;render();window.scrollTo(0,0);}

/* ---------- actions ---------- */
function addRally(pid,kind){
  var m=curMatch();if(!m)return;
  var ms=matchState(m);if(ms.cur.over)return;
  var T=m.tm.indexOf(pid)<2?0:1;
  var scoring=kind==='w'?T:1-T;
  m.g[m.g.length-1].r.push(scoring+':'+pid+':'+kind+':'+(ui.shot||'')+':'+Date.now());
  ui.shot='';buzz();touchM(m);render();
}
function undo(){
  var m=curMatch();if(!m)return;
  var g=m.g[m.g.length-1];
  if(!g.r.length&&m.g.length>1){m.g.pop();g=m.g[m.g.length-1];}
  if(g.r.length)g.r.pop();
  ui.next=null;touchM(m);render();
}
function addPlayer(name){
  name=(name||'').trim();
  if(!name){ui.err='Type a name first.';return false;}
  if(players().some(function(p){return p.name.toLowerCase()===name.toLowerCase();})){ui.err=name+' is already on the list.';return false;}
  var p={id:uid(),name:name,uid:null,by:meId(),u:Date.now()};S.players.push(p);touchP(p);ui.err='';return true;
}
function startMatch(){
  readForm();
  var f=ui.form,ids=f.sz==='1'?[f.a1,f.b1]:[f.a1,f.a2,f.b1,f.b2];
  if(ids.some(function(x){return !x;})||new Set(ids).size<ids.length){ui.err='Pick four different players.';render();return;}
  var m={id:uid(),t:Date.now(),u:Date.now(),tg:+f.tg,bo:+f.bo,sz:+f.sz,smode:'owner',tm:ids,by:meId(),pids:ids.slice(),g:[{f:+f.sv,pos:ids.slice(),r:[]}]};
  S.matches.push(m);touchM(m);ui.mid=m.id;ui.view='match';ui.err='';ui.shot='';render();window.scrollTo(0,0);
}



document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'tab':go(b.dataset.v);break;
    case 'signin':ui.err='';render();cloud.api.signIn().catch(function(e){ui.err=authMsg(e);render();});break;
    case 'signout':cloud.api.signOut().catch(function(){});break;
    case 'claim':cloud.api.update('players',id,{uid:meId()}).then(function(){go('me');}).catch(function(e){ui.err='Could not link this name. Someone may have claimed it already.';render();});break;
    case 'new':ui.err='';ui.view='new';render();window.scrollTo(0,0);break;
    case 'back':if(ui.tab==='stats')go('stats','stats');else go('matches','list');break;
    case 'start':startMatch();break;
    case 'open':{ui.mid=id;var m=curMatch();ui.view=m&&(matchState(m).done||m.by!==meId())?'detail':'match';ui.shot='';ui.next=null;render();window.scrollTo(0,0);break;}
    case 'detail':ui.mid=id;ui.view='detail';render();window.scrollTo(0,0);break;
    case 'resume':ui.mid=id;ui.view='match';ui.next=null;render();window.scrollTo(0,0);break;
    case 'pt':addRally(b.dataset.p,'w');break;
    case 'er':addRally(b.dataset.p,'e');break;
    case 'fault':addRally(b.dataset.p,'f');break;
    case 'shot':ui.shot=ui.shot===b.dataset.s?'':b.dataset.s;render();break;
    case 'undo':undo();break;
    case 'nserve':if(ui.next){ui.next.f=+b.dataset.t;render();}break;
    case 'nswap':if(ui.next){var T=+b.dataset.t,p=ui.next.pos,t=p[T*2];p[T*2]=p[T*2+1];p[T*2+1]=t;render();}break;
    case 'startnext':{var m2=curMatch();if(m2&&ui.next){m2.g.push({f:ui.next.f,pos:ui.next.pos.slice(),r:[]});ui.next=null;ui.shot='';touchM(m2);render();window.scrollTo(0,0);}break;}
    case 'delmatch':{
      if(ui.confirm!=='del:'+id){ui.confirm='del:'+id;render();break;}
      var dm=S.matches.find(function(x){return x.id===id;});
      if(dm){dm.del=1;dm.g=[];touchM(dm);}
      ui.confirm=null;ui.mid=null;go('matches','list');break;
    }
    case 'ren':ui.edit=id;render();setTimeout(function(){var i=document.getElementById('rn');if(i){i.focus();i.select();}},0);break;
    case 'cancel-edit':ui.edit=null;render();break;
    case 'rmp':{
      if(ui.confirm!=='rm:'+id){ui.confirm='rm:'+id;render();break;}
      var rp=S.players.find(function(x){return x.id===id;});
      if(rp){rp.del=1;touchP(rp);}
      ui.confirm=null;render();break;
    }
    case 'player':ui.pid=id;ui.view='player';render();window.scrollTo(0,0);break;
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  if(f.dataset.form==='addp'){
    if(ui.tab==='matches')readForm();
    var inp=document.getElementById('np');
    addPlayer(inp?inp.value:'');
    render();
    var i2=document.getElementById('np');if(i2&&ui.err)i2.focus();
  }else if(f.dataset.form==='ren'){
    var nm=(document.getElementById('rn').value||'').trim(),p=S.players.find(function(x){return x.id===f.dataset.id;});
    if(!nm){ui.err='Name cannot be empty.';render();return;}
    if(p){p.name=nm;touchP(p);}
    ui.edit=null;ui.err='';render();
  }
});
document.addEventListener('change',function(e){if(e.target.closest('#view')&&ui.tab==='matches'&&ui.view==='new'){readForm();if(e.target.id==='f-tg')render();}});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){
    window.__wl=null;if(ui.tab==='matches'&&ui.view==='match')keepAwake();
  }
});

render();
if('serviceWorker' in navigator&&!window.__FAKE_CLOUD__)navigator.serviceWorker.register('sw.js').catch(function(){});
bootCloud().catch(function(){ui.auth='out';ui.err='Could not reach Google. Check your internet and refresh.';render();});
})();
</script>
</body></html>
